  if(!ok) return;
  DATA.todos = DATA.todos.filter(x=>x.id!==id);
  persist('todos');
  renderTodosTable();
  toast('已刪除待辦事項');
}

function openTodoModal(id, prefill){
  const editing = !!id;
  const t = editing ? DATA.todos.find(x=>x.id===id) : Object.assign({
    id: uid(), dueDate: todayISO(), updatedDate: todayISO(), client:'', category:'', title:'',
    priority:'待處理', progress:'待處理', note:'', done:false, projectId:'',
  }, prefill||{});
  const box = document.getElementById('modalBox');
  box.className = 'modal';
  const categories = ['合約','報價','發票','維護紀錄','會議','DD'];
  const progressOptions = ['待處理','內部進行中','客戶進行中'];
  box.innerHTML = `
    <div class="modal-head">
      <div class="modal-title">${editing?'編輯待辦事項':'新增待辦事項'}</div>
      <button class="modal-close" id="mClose" aria-label="關閉視窗">${ICONS.close}</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-field">
          <label>到期日</label>
          <input id="f_due" type="date" value="${t.dueDate||''}">
        </div>
        <div class="form-field">
          <label>優先順序</label>
          <select id="f_priority">
            ${['本週','本月','待處理'].map(p=>`<option ${t.priority===p?'selected':''}>${p}</option>`).join('')}
          </select>
        </div>
        <div class="form-field">
          <label>客戶名稱</label>
          <input list="clientList2" id="f_client" value="${esc(t.client)}" placeholder="輸入或選擇客戶">
          <datalist id="clientList2">${DATA.clients.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
        </div>
        <div class="form-field">
          <label>類別</label>
          <input list="catList" id="f_category" value="${esc(t.category)}" placeholder="輸入或選擇類別">
          <datalist id="catList">${categories.map(c=>`<option value="${c}">`).join('')}</datalist>
        </div>
        <div class="form-field full">
          <label>項目/專案 <span style="color:var(--red);">*</span></label>
          <input list="projList" id="f_title" value="${esc(t.title)}" placeholder="輸入項目名稱,或關聯專案總覽中的專案">
          <datalist id="projList">${DATA.projects.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
        </div>
        <div class="form-field full">
          <label>關聯專案(選填,關聯後可在專案預覽中看到這筆待辦)</label>
          <select id="f_projectId">
            <option value="">不關聯專案</option>
            ${DATA.projects.map(p=>`<option value="${p.id}" ${t.projectId===p.id?'selected':''}>${esc(p.name)}${p.client?`(${esc(p.client)})`:''}</option>`).join('')}
          </select>
        </div>
        <div class="form-field full">
          <label>進度狀態</label>
          <select id="f_progress">
            ${progressOptions.map(p=>`<option ${t.progress===p?'selected':''}>${p}</option>`).join('')}
          </select>
        </div>
        <div class="form-field full">
          <label>備註說明</label>
          <textarea id="f_note" placeholder="補充說明">${esc(t.note||'')}</textarea>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="mCancel">取消</button>
      <button class="btn btn-primary" id="mSave">${editing?'儲存變更':'新增待辦'}</button>
    </div>
  `;
  openModalOverlay();
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('f_title').addEventListener('input', e=> clearFieldError(e.target));
  document.getElementById('mSave').addEventListener('click', async ()=>{
    clearAllFieldErrors(box);
    const titleInput = document.getElementById('f_title');
    const title = titleInput.value.trim();
    if(!title){ markFieldError(titleInput, '請填寫項目/專案名稱'); toast('請確認標示為紅色的必填欄位'); titleInput.focus(); return; }
    const saveBtn = document.getElementById('mSave');
    saveBtn.disabled = true;
    saveBtn.textContent = '儲存中…';
    const client = document.getElementById('f_client').value.trim();
    ensureClient(client);
    const rec = {
      id: t.id, dueDate: document.getElementById('f_due').value, updatedDate: todayISO(),
      client, category: document.getElementById('f_category').value.trim(), title,
      priority: document.getElementById('f_priority').value, progress: document.getElementById('f_progress').value.trim(),
      note: document.getElementById('f_note').value.trim(),
      projectId: document.getElementById('f_projectId').value || '',
      done: t.done||false,
    };
    const idx = DATA.todos.findIndex(x=>x.id===t.id);
    if(idx>=0) DATA.todos[idx]=rec; else DATA.todos.push(rec);
    await persist('todos');
    closeModal();
    if(currentPage==='todos') renderTodosTable();
    if(currentPage==='projects') renderProjectsTable();
    toast(editing?'已儲存變更':'已新增待辦');
  });
}

/* ============================================================
   CONTACTS PAGE
   ============================================================ */
function contactsTpl(){
  return `
  <div class="page active" id="page-contacts">
    ${pageHeaderHtml('contacts', ICONS.contacts, '聯絡清單', `共 ${DATA.contacts.length} 位聯絡人`)}
    <div class="filter-bar">
      <label for="ctSearch" class="visually-hidden">搜尋聯絡人</label>
      <input type="text" id="ctSearch" placeholder="搜尋客戶／姓名／職稱">
      <div class="filter-spacer"></div>
    </div>
    <div id="contactsRoot"></div>
  </div>`;
}

function afterContactsRender(){
  renderContactsList();
  document.getElementById('ctSearch').addEventListener('input', e=> renderContactsList(e.target.value));
}

function renderContactsList(q){
  q = (q||'').toLowerCase();
  const root = document.getElementById('contactsRoot');
  let list = DATA.contacts.filter(c=>{
    if(!q) return true;
    return [c.company,c.name,c.role].some(v=>(v||'').toLowerCase().includes(q));
  });
  if(!list.length){
    root.innerHTML = `<div class="card">${emptyState('目前沒有聯絡人資料', ICONS.contacts)}</div>`;
    return;
  }
  const groups = {};
  list.forEach(c=>{ const k=c.company||'未分類客戶'; (groups[k]=groups[k]||[]).push(c); });

  root.innerHTML = Object.keys(groups).sort().map(company=>{
    const items = groups[company];
    const projCount = DATA.projects.filter(p=>p.client===company).length;
    return `<div class="contact-group">
      <div class="contact-group-title">${esc(company)} <span class="n">${items.length} 位聯絡人${projCount?` · ${projCount} 個關聯專案`:''}</span></div>
      <div class="contact-grid">
        ${items.map(c=>`
          <div class="card contact-card">
            <div class="contact-actions">
              <button class="icon-btn" data-edit="${c.id}" title="編輯聯絡人" aria-label="編輯聯絡人 ${esc(c.name)}">${ICONS.edit}</button>
              <button class="icon-btn danger" data-del="${c.id}" title="刪除聯絡人" aria-label="刪除聯絡人 ${esc(c.name)}">${ICONS.trash}</button>
            </div>
            <div class="contact-name">${esc(c.name)}</div>
            <div class="contact-role">${esc(c.role||'')}${c.department?`・${esc(c.department)}`:''}</div>
            ${c.phone?`<div class="contact-line">${ICONS.phone}${esc(c.phone)}</div>`:''}
            ${c.email?`<div class="contact-line">${ICONS.mail}${esc(c.email)}</div>`:''}
            ${c.address?`<div class="contact-line">${ICONS.briefcase}${esc(c.address)}</div>`:''}
            ${c.note?`<div class="contact-line">${ICONS.empty}${esc(c.note)}</div>`:''}
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');

  root.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=> openContactModal(b.dataset.edit)));
  root.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=> confirmDeleteContact(b.dataset.del)));
}

async function confirmDeleteContact(id){
  const c = DATA.contacts.find(x=>x.id===id);
  if(!c) return;
  const ok = await confirmDialog({
    title:'刪除聯絡人',
    message:`確定要刪除聯絡人「${c.name}」嗎?`,
    confirmLabel:'刪除', cancelLabel:'取消', danger:true,
  });
  if(!ok) return;
  DATA.contacts = DATA.contacts.filter(x=>x.id!==id);
  persist('contacts');
  renderContactsList();
  toast('已刪除聯絡人');
}

      id: c.id, company, name, role: document.getElementById('f_role').value.trim(),
      department: document.getElementById('f_department').value.trim(),
      phone: document.getElementById('f_phone').value.trim(), email: document.getElementById('f_email').value.trim(),
      address: document.getElementById('f_address').value.trim(),
      note: document.getElementById('f_note').value.trim(),
    };
    const idx = DATA.contacts.findIndex(x=>x.id===c.id);
    if(idx>=0) DATA.contacts[idx]=rec; else DATA.contacts.push(rec);
    await persist('contacts');

    toast(editing?'已儲存變更':'已新增聯絡人');

/* ============================================================
   NOTES PAGE (記事本)
   ============================================================ */
const NOTE_COLORS = [
  {id:'yellow', label:'黃', bg:'#FDF3D8', border:'#E4C15B'},
  {id:'blue',   label:'藍', bg:'#E4EEF4', border:'#7FA8BF'},
  {id:'green',  label:'綠', bg:'#E7EFE6', border:'#8CAE85'},
  {id:'pink',   label:'粉', bg:'#F6E6E6', border:'#CE9797'},
  {id:'gray',   label:'灰', bg:'#EFEDEA', border:'#B7B0A6'},
];
function noteColorInfo(id){
  return NOTE_COLORS.find(c=>c.id===id) || NOTE_COLORS[0];
}
const NOTE_CATEGORIES = ['會議記錄','客戶溝通','一般'];

function notesTpl(){
  return `
  <div class="page active" id="page-notes">
    ${pageHeaderHtml('notes', ICONS.notes, '記事本', `共 ${DATA.notes.length} 則記事`)}
    <div class="filter-bar">
      <div class="seg" id="noteFilterSeg">
        <button data-v="all" class="${!noteFilter.pinnedOnly?'active':''}">全部</button>
        <button data-v="pinned" class="${noteFilter.pinnedOnly?'active':''}">已釘選</button>
      </div>
      <label for="noteSearch" class="visually-hidden">搜尋記事</label>
      <input type="text" id="noteSearch" placeholder="搜尋標題／內容／客戶" value="${esc(noteFilter.q)}">
      <div class="filter-spacer"></div>
    </div>
    <div id="notesRoot"></div>
  </div>`;
}

function afterNotesRender(){
  renderNotesList();
  document.getElementById('noteSearch').addEventListener('input', e=>{ noteFilter.q = e.target.value; renderNotesList(); });
  document.querySelectorAll('#noteFilterSeg button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      noteFilter.pinnedOnly = (btn.dataset.v==='pinned');
      document.querySelectorAll('#noteFilterSeg button').forEach(b=> b.classList.toggle('active', b===btn));
      renderNotesList();
    });
  });
}

function filteredNotes(){
  return DATA.notes.filter(n=>{
    if(noteFilter.pinnedOnly && !n.pinned) return false;
    if(noteFilter.q){
      const q = noteFilter.q.toLowerCase();
      const hit = [n.title, n.content, n.client].some(v=>(v||'').toLowerCase().includes(q));
      if(!hit) return false;
    }
    return true;
  }).sort((a,b)=>{
    if(!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    return (b.updatedAt||'').localeCompare(a.updatedAt||'');
  });
}

function renderNotesList(){
  const root = document.getElementById('notesRoot');
  const list = filteredNotes();
  if(!list.length){
    root.innerHTML = `<div class="card">${emptyState('目前沒有符合條件的記事,點選左側「新增」開始記錄吧', ICONS.notes)}</div>`;
    return;
  }
  root.innerHTML = `<div class="notes-grid">
    ${list.map(n=>{
      const c = noteColorInfo(n.color);
      const proj = n.projectId ? DATA.projects.find(p=>p.id===n.projectId) : null;
      const metaBits = [];
      if(n.client) metaBits.push(esc(n.client));
      if(proj) metaBits.push(`關聯:${esc(proj.name)}`);
      if(n.category) metaBits.push(esc(n.category));
      return `<div class="card note-card" style="background:${c.bg};border-left-color:${c.border};" data-open="${n.id}">
        <div class="note-actions">
          <button class="icon-btn" data-pin="${n.id}" title="${n.pinned?'取消釘選':'釘選'}" aria-label="${n.pinned?'取消釘選':'釘選'}記事「${esc(n.title||'')}」">${n.pinned?ICONS.pinFilled:ICONS.pin}</button>
          <button class="icon-btn danger" data-del="${n.id}" title="刪除記事" aria-label="刪除記事「${esc(n.title||'')}」">${ICONS.trash}</button>
        </div>
        <div class="note-top">
          <div class="note-title">${esc(n.title||'(無標題)')}</div>
        </div>
        <div class="note-content">${esc(n.content||'')}</div>
        <div class="note-meta">
          ${metaBits.map(m=>`<span class="badge badge-gray">${m}</span>`).join('')}
          <span style="margin-left:auto;">${esc(n.updatedAt||'')}</span>
        </div>
      </div>`;
    }).join('')}
  </div>`;

  root.querySelectorAll('[data-open]').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.closest('[data-pin]') || e.target.closest('[data-del]')) return;
      openNoteModal(card.dataset.open);
    });
  });
  root.querySelectorAll('[data-pin]').forEach(b=>{
    b.addEventListener('click', e=>{
      e.stopPropagation();
      const n = DATA.notes.find(x=>x.id===b.dataset.pin);
      if(!n) return;
      n.pinned = !n.pinned;
      persist('notes');
      renderNotesList();
      toast(n.pinned?'已釘選記事':'已取消釘選');
    });
  });
  root.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', e=>{ e.stopPropagation(); confirmDeleteNote(b.dataset.del); });
  });
}

async function confirmDeleteNote(id){
  const n = DATA.notes.find(x=>x.id===id);
  if(!n) return;
  const ok = await confirmDialog({
    title:'刪除記事',
    message:`確定要刪除記事「${n.title||'(無標題)'}」嗎?`,
    confirmLabel:'刪除', cancelLabel:'取消', danger:true,
  });
  if(!ok) return;
  DATA.notes = DATA.notes.filter(x=>x.id!==id);
  persist('notes');
  renderNotesList();
  toast('已刪除記事');
}

function openNoteModal(id, prefill){
  const editing = !!id;
  const n = editing ? DATA.notes.find(x=>x.id===id) : Object.assign({
    id: uid(), title:'', content:'', client:'', projectId:'', category:'', color:'yellow', pinned:false,
    createdAt: todayISO(), updatedAt: todayISO(),
  }, prefill||{});
  const box = document.getElementById('modalBox');
  box.className = 'modal';
  box.innerHTML = `
    <div class="modal-head">
      <div class="modal-title">${editing?'編輯記事':'新增記事'}</div>
      <button class="modal-close" id="mClose" aria-label="關閉視窗">${ICONS.close}</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-field full">
          <label>標題 <span style="color:var(--red);">*</span></label>
          <input id="f_title" value="${esc(n.title)}" placeholder="記事標題">
        </div>
        <div class="form-field full">
          <label>內容 <span style="color:var(--red);">*</span></label>
          <textarea id="f_content" rows="6" placeholder="記錄內容...">${esc(n.content||'')}</textarea>
        </div>
        <div class="form-field">
          <label>客戶名稱</label>
          <input list="clientListNote" id="f_client" value="${esc(n.client||'')}" placeholder="輸入或選擇客戶">
          <datalist id="clientListNote">${DATA.clients.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
        </div>
        <div class="form-field">
          <label>關聯專案</label>
          <select id="f_projectId">
            <option value="">不關聯專案</option>
            ${DATA.projects.map(p=>`<option value="${p.id}" ${n.projectId===p.id?'selected':''}>${esc(p.name)}${p.client?`(${esc(p.client)})`:''}</option>`).join('')}
          </select>
        </div>
        <div class="form-field">
          <label>分類</label>
          <input list="noteCatList" id="f_category" value="${esc(n.category||'')}" placeholder="輸入或選擇分類">
          <datalist id="noteCatList">${NOTE_CATEGORIES.map(c=>`<option value="${c}">`).join('')}</datalist>
        </div>
        <div class="form-field">
          <label>顏色標籤</label>
          <div style="display:flex;gap:8px;align-items:center;padding-top:4px;">
            ${NOTE_COLORS.map(c=>`
              <button type="button" class="note-color-swatch" data-color="${c.id}" title="${c.label}"
                style="width:28px;height:28px;border-radius:50%;cursor:pointer;background:${c.bg};border:2px solid ${(n.color||'yellow')===c.id?c.border:'transparent'};box-shadow:0 0 0 1px ${c.border} inset;"></button>
            `).join('')}
          </div>
        </div>
        <div class="form-field full">
          <label class="checkbox-row"><input type="checkbox" id="f_pinned" ${n.pinned?'checked':''}>釘選在最上面</label>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="mCancel">取消</button>
      <button class="btn btn-primary" id="mSave">${editing?'儲存變更':'新增記事'}</button>
    </div>
  `;
  openModalOverlay();
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mCancel').addEventListener('click', closeModal);
  document.getElementById('f_title').addEventListener('input', e=> clearFieldError(e.target));
  document.getElementById('f_content').addEventListener('input', e=> clearFieldError(e.target));

  let selectedColor = n.color || 'yellow';
  box.querySelectorAll('.note-color-swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      selectedColor = sw.dataset.color;
      box.querySelectorAll('.note-color-swatch').forEach(s=>{
        const info = noteColorInfo(s.dataset.color);
        s.style.border = `2px solid ${s.dataset.color===selectedColor?info.border:'transparent'}`;
      });
    });
  });

  document.getElementById('mSave').addEventListener('click', async ()=>{
    clearAllFieldErrors(box);
    const titleInput = document.getElementById('f_title');
    const contentInput = document.getElementById('f_content');
    const title = titleInput.value.trim();
    const content = contentInput.value.trim();
    let hasError = false;
    if(!title){ markFieldError(titleInput, '請填寫標題'); hasError = true; }
    if(!content){ markFieldError(contentInput, '請填寫內容'); hasError = true; }
    if(hasError){ toast('請確認標示為紅色的必填欄位'); (!title?titleInput:contentInput).focus(); return; }
    const saveBtn = document.getElementById('mSave');
    saveBtn.disabled = true;
    saveBtn.textContent = '儲存中…';
    const client = document.getElementById('f_client').value.trim();
    if(client) ensureClient(client);
    const rec = {
      id: n.id, title, content,
      client, projectId: document.getElementById('f_projectId').value || '',
      category: document.getElementById('f_category').value.trim(),
      color: selectedColor, pinned: document.getElementById('f_pinned').checked,
      createdAt: n.createdAt || todayISO(), updatedAt: todayISO(),
    };
    const idx = DATA.notes.findIndex(x=>x.id===n.id);
    if(idx>=0) DATA.notes[idx]=rec; else DATA.notes.push(rec);
    await persist('notes');
    closeModal();
    if(currentPage==='notes') renderNotesList();
    toast(editing?'已儲存變更':'已新增記事');
  });
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id==='modalOverlay') closeModal();
});

/* 導覽:瀏覽器上一頁/下一頁按鈕觸發時,依網址列還原對應的工作區與頁面。
   這裡只重新渲染畫面,不再呼叫 updateUrlHash() 推新的歷史紀錄,
   避免使用者按上一頁卻又被推回下一頁的情況。 */
window.addEventListener('popstate', ()=>{
  if(!appInitialized) return; // 尚未登入完成、init() 還沒跑過時不處理
  const parsed = parseUrlHash();
  currentWorkspace = parsed ? parsed.ws : currentWorkspace;
  const validIds = getCurrentNav().map(n=>n.id).concat('dashboard');
  let page = parsed ? parsed.page : currentPage;
  if(!validIds.includes(page)) page = 'dashboard';
  currentPage = page;
  updateWorkspaceMenuUI();
  renderNav();
  renderPage();
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); return; }
  // 無障礙:Modal 開啟時把 Tab 鍵焦點鎖在視窗內,避免鍵盤使用者 Tab 到背景看不見的元素
  if(e.key!=='Tab') return;
  const overlay = document.getElementById('modalOverlay');
  if(!overlay.classList.contains('show')) return;
  const box = document.getElementById('modalBox');
  const focusable = Array.from(box.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
    .filter(el=> !el.disabled && el.offsetParent!==null);
  if(!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length-1];
  if(e.shiftKey && document.activeElement===first){
    e.preventDefault();
    last.focus();
  } else if(!e.shiftKey && document.activeElement===last){
    e.preventDefault();
    first.focus();
  }
});

async function clearAllData(){
  const ok = await confirmDialog({
    title:'清除所有資料',
    message:'確定要清空所有專案／待辦／聯絡人／記事資料嗎?此動作無法復原(建議先匯出備份)。',
    confirmLabel:'清空資料', cancelLabel:'取消', danger:true,
  });
  if(!ok) return;
  DATA.projects = [];
  DATA.todos = [];
  DATA.contacts = [];
  DATA.clients = [];
  DATA.notes = [];
  await Promise.all(Object.keys(STORE_KEYS).map(k=>persist(k)));
  todoFilter = { priority:'all', q:'' };
  projFilter = { q:'', pm:'', sales:'' };
  noteFilter = { q:'', pinnedOnly:false };
  goPage('dashboard');
  toast('已清空所有資料');
}

/* ============================================================
   BACKUP EXPORT / RESTORE
   (建議:每次系統更新前先匯出備份,更新後如發現資料被重置,
   可用「還原備份檔」把資料復原回來)
   ============================================================ */
function exportBackup(){
  try{
    const payload = {
      exportedAt: new Date().toISOString(),
      projects: DATA.projects, todos: DATA.todos, contacts: DATA.contacts, clients: DATA.clients, notes: DATA.notes,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    a.href = url;
    a.download = `專案管理備份_${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
    toast('備份檔已下載');
  }catch(e){
    console.error(e);
    toast('匯出失敗,請再試一次');
  }
}

function importBackupFromFile(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const obj = JSON.parse(reader.result);
      const hasAny = Array.isArray(obj.projects) || Array.isArray(obj.todos) || Array.isArray(obj.contacts) || Array.isArray(obj.clients) || Array.isArray(obj.notes);
      if(!hasAny){ toast('這個檔案格式看起來不對,請確認是本系統匯出的備份檔'); return; }
      const ok = await confirmDialog({
        title:'還原備份檔',
        message:'確定要用這個備份檔還原嗎?目前畫面上的所有專案／待辦／聯絡人／記事資料將會被覆蓋。',
        confirmLabel:'還原', cancelLabel:'取消', danger:true,
      });
      if(!ok) return;
      DATA.projects = Array.isArray(obj.projects) ? obj.projects : [];
      DATA.todos = Array.isArray(obj.todos) ? obj.todos : [];
      DATA.contacts = Array.isArray(obj.contacts) ? obj.contacts : [];
      DATA.clients = Array.isArray(obj.clients) ? obj.clients : [];
      DATA.notes = Array.isArray(obj.notes) ? obj.notes : [];
      await Promise.all(Object.keys(STORE_KEYS).map(k=>persist(k)));
      goPage('dashboard');
      toast('已還原備份資料');
    }catch(e){
      console.error(e);
      toast('讀取備份檔失敗,請確認檔案內容');
    }
  };
  reader.readAsText(file);
}

async function init(){
  const fromHash = parseUrlHash();
  currentWorkspace = fromHash ? fromHash.ws : await loadWorkspace();
  if(fromHash){
    const validIds = getCurrentNav().map(n=>n.id).concat('dashboard');
    currentPage = validIds.includes(fromHash.page) ? fromHash.page : 'dashboard';
  }
  renderNav();
  await loadAll();
  renderPage();
  renderNotifications();
  updateUrlHash(); // 網址對不上目前實際狀態(例如頁面代碼失效)時,同步修正回去

  const collapseBtn = document.getElementById('collapseBtn');
  if(collapseBtn) collapseBtn.addEventListener('click', toggleSidebar);

  const homeBtn = document.getElementById('homeDashboardBtn');
  if(homeBtn) homeBtn.addEventListener('click', ()=> goPage('dashboard'));

  const globalAddBtn = document.getElementById('globalAddBtn');
  if(globalAddBtn) globalAddBtn.addEventListener('click', openAddWizard);

  const wsTrigger = document.getElementById('workspaceTriggerBtn');
  if(wsTrigger) wsTrigger.addEventListener('click', e=>{ e.stopPropagation(); toggleWorkspaceMenu(); });
  document.querySelectorAll('.ws-menu-item').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      toggleWorkspaceMenu(false);
      switchWorkspace(btn.dataset.ws);
    });
  });
  document.addEventListener('click', e=>{
    const wrap = document.getElementById('workspaceSwitcher');
    if(wrap && wrap.classList.contains('open') && !wrap.contains(e.target)) toggleWorkspaceMenu(false);
  });
  updateWorkspaceMenuUI();

  // 觸控與互動:讓漢堡選單／通知選單在觸控裝置上也能點擊開關,不再只依賴 hover
  setupClickMenu('hamburgerWrap', 'hamburgerBtn', 'hamburgerMenu');
  setupClickMenu('notifWrap', 'notifBtn', 'notifMenu');

  // 全站搜尋:手機版把搜尋框收成一個圖示按鈕,點擊後展開成頂部下拉的搜尋列
  const searchToggleBtn = document.getElementById('topbarSearchToggleBtn');
  const searchMobileBar = document.getElementById('topbarSearchMobile');
  const searchMobileClose = document.getElementById('topbarSearchMobileClose');
  const searchMobileInput = document.getElementById('globalSearchInputMobile');
  function openMobileSearch(){
    searchMobileBar.classList.add('show');
    searchToggleBtn.setAttribute('aria-expanded', 'true');
    searchMobileInput.focus();
  }
  function closeMobileSearch(){
    searchMobileBar.classList.remove('show');
    searchToggleBtn.setAttribute('aria-expanded', 'false');
  }
  if(searchToggleBtn && searchMobileBar && searchMobileClose && searchMobileInput){
    searchToggleBtn.setAttribute('aria-expanded', 'false');
    searchToggleBtn.addEventListener('click', openMobileSearch);
    searchMobileClose.addEventListener('click', closeMobileSearch);
    document.addEventListener('keydown', e=>{
      if(e.key==='Escape' && searchMobileBar.classList.contains('show')) closeMobileSearch();
    });
  }
  setupGlobalSearch('globalSearchInput', 'searchResultsDesktop');
  setupGlobalSearch('globalSearchInputMobile', 'searchResultsMobile');

  const exportBtn = document.getElementById('exportBackupBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportBackup);
  const importBtn = document.getElementById('importBackupBtn');
  const importFileInput = document.getElementById('importBackupFile');
  if(importBtn && importFileInput){
    importBtn.addEventListener('click', ()=> importFileInput.click());
    importFileInput.addEventListener('change', e=>{
      const file = e.target.files && e.target.files[0];
      if(file) importBackupFromFile(file);
      importFileInput.value = '';
    });
  }
  const clearAllBtn = document.getElementById('clearAllBtn');
  if(clearAllBtn) clearAllBtn.addEventListener('click', clearAllData);

  const signOutBtn = document.getElementById('signOutBtn');
  if(signOutBtn) signOutBtn.addEventListener('click', ()=> fbAuth.signOut());
}

/* ============================================================
   AUTH — Google 登入 / 登出 / 狀態切換
   ============================================================ */
let appInitialized = false;

function isMobileBrowser(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
}

document.getElementById('googleSignInBtn').addEventListener('click', ()=>{
  const errEl = document.getElementById('loginGateError');
  errEl.textContent = '';
  const provider = new firebase.auth.GoogleAuthProvider();
  if(isMobileBrowser()){
    fbAuth.signInWithRedirect(provider).catch(err=>{
      console.error(err);
      errEl.textContent = '登入失敗:' + (err.message || err.code || '請再試一次');
    });
  } else {
    fbAuth.signInWithPopup(provider).catch(err=>{
      console.error(err);
      errEl.textContent = '登入失敗:' + (err.message || err.code || '請再試一次');
    });
  }
});

fbAuth.getRedirectResult().catch(err=>{
  console.error('redirect result error:', err);
  const errEl = document.getElementById('loginGateError');
  if(errEl) errEl.textContent = '登入失敗:' + (err.message || err.code || '請再試一次');
});

fbAuth.onAuthStateChanged(async (user)=>{
  const gate = document.getElementById('loginGate');
  const root = document.getElementById('appRoot');
  if(user){
    currentUid = user.uid;
    gate.style.display = 'none';
    root.style.display = '';
    applyGoogleIdentity(user);
    const loggedInLabel = document.getElementById('loggedInAsLabel');
    if(loggedInLabel) loggedInLabel.textContent = '已登入:' + (user.email || user.displayName || '');
    if(!appInitialized){
      appInitialized = true;
      init();
    }
  } else {
    currentUid = null;
    appInitialized = false;
    gate.style.display = 'flex';
    root.style.display = 'none';
  }
});
</script>
