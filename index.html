<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專案管理工作台</title>
<style>
  :root{
    --navy:#2F4156;
    --teal:#567C8D;
    --sky:#C8D9E6;
    --beige:#F5EFEB;
    --white:#FFFFFF;

    --bg:var(--beige);
    --sidebar-bg:var(--beige);
    --card:var(--white);
    --blue-900:var(--navy);
    --blue-800:var(--navy);
    --blue-700:var(--teal);
    --blue-500:var(--teal);
    --blue-300:var(--sky);
    --blue-200:var(--sky);
    --blue-100:rgba(86,124,141,0.16);
    --blue-050:rgba(86,124,141,0.08);
    --red:#B15C52;
    --red-soft:#E3C6BF;
    --red-bg:#F7EAE7;
    --text:var(--navy);
    /* 無障礙:提高次要文字對比度。原本 0.65 / 0.42 透明度在白色卡片背景上
       實測約僅 3.8:1 / 2.2:1,低於 WCAG AA 一般文字所需的 4.5:1 / 3:1 門檻。
       調整後 text-muted 約 5:1(達 AA 標準),text-faint 約 3.3:1
       (達大字體／UI元件的 3:1 門檻,仍保留比 text-muted 淡的視覺層次)。 */
    --text-muted:rgba(47,65,86,0.75);
    --text-faint:rgba(47,65,86,0.60);
    --border:var(--sky);
    --ok:var(--teal);
    --sidebar-w:196px;
    --topbar-h:64px;
    --shadow: 0 2px 10px rgba(47,65,86,0.08), 0 1px 2px rgba(47,65,86,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  ::selection{background:var(--blue-200);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--blue-300);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- Top Title Bar ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; height:var(--topbar-h); z-index:60;
    background:linear-gradient(92deg, var(--blue-900) 0%, var(--blue-800) 55%, var(--blue-700) 100%);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 28px 0 18px;
    box-shadow:0 3px 16px rgba(51,82,107,0.3);
  }
  .topbar-brand{ display:flex; align-items:center; gap:13px; }
  .topbar-logo{
    width:40px;height:40px;border-radius:12px; flex:none;
    background:linear-gradient(150deg, var(--white), var(--blue-100) 120%);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:15px;color:var(--blue-900);letter-spacing:.5px;
    box-shadow:0 3px 10px rgba(20,35,45,0.28);
    font-family:'Georgia','Noto Serif TC',serif;
  }
  .topbar-title{ display:flex; flex-direction:column; line-height:1.18; }
  .topbar-title .main{ font-size:21px; font-weight:800; color:#fff; letter-spacing:2px; }
  .topbar-title .sub{ font-size:10px; font-weight:600; color:rgba(255,255,255,0.5); letter-spacing:3.5px; text-transform:uppercase; margin-top:3px; }
  .topbar-right{ display:flex; align-items:center; gap:16px; }

  /* ---------- Global Search (topbar) ---------- */
  .topbar-search{
    position:relative; flex:1; max-width:420px; margin:0 24px; height:38px;
    display:flex; align-items:center; gap:9px; padding:0 14px;
    background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.22); border-radius:10px;
    transition:.15s ease;
  }
  .topbar-search:focus-within{ background:rgba(255,255,255,0.22); border-color:rgba(255,255,255,0.4); }
  .topbar-search-icon{ width:16px;height:16px; color:rgba(255,255,255,0.75); flex:none; }
  .topbar-search input{
    flex:1; min-width:0; appearance:none; border:none; outline:none; background:transparent;
    font-family:inherit; font-size:13.5px; color:#fff;
  }
  .topbar-search input::placeholder{ color:rgba(255,255,255,0.6); }
  #topbarSearchToggleBtn{ display:none; }

  /* ---------- Global Search results dropdown ---------- */
  .search-results{
    position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:80;
    background:#fff; border-radius:14px; box-shadow:0 16px 40px rgba(30,45,55,0.28);
    border:1px solid var(--border); padding:8px; max-height:70vh; overflow-y:auto;
    display:none;
  }
  .search-results.show{ display:block; }
  .search-results-group{ margin-bottom:4px; }
  .search-results-group:last-child{ margin-bottom:0; }
  .search-results-group-title{
    font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase;
    letter-spacing:.4px; padding:8px 10px 4px;
  }
  .search-result-item{
    display:flex; flex-direction:column; gap:2px; width:100%; text-align:left;
    appearance:none; border:none; background:transparent; cursor:pointer; font-family:inherit;
    padding:9px 10px; border-radius:9px;
  }
  .search-result-item:hover, .search-result-item:focus-visible{ background:var(--blue-050); outline:none; }
  .search-result-item .sr-title{ font-size:13.5px; font-weight:700; color:var(--blue-900); }
  .search-result-item .sr-meta{ font-size:11.5px; color:var(--text-muted); }
  .search-results-more{ font-size:11.5px; color:var(--text-faint); padding:6px 10px 4px; }
  .search-results-empty{ padding:24px 12px; text-align:center; color:var(--text-muted); font-size:12.5px; }
  .search-results-hint{ padding:24px 12px; text-align:center; color:var(--text-faint); font-size:12.5px; }

  /* ---------- Global Search (mobile overlay bar) ---------- */
  .topbar-search-mobile{
    position:fixed; top:var(--topbar-h); left:0; right:0; z-index:59;
    background:var(--blue-900); padding:10px 14px; box-shadow:0 6px 16px rgba(20,35,45,0.25);
    display:none; flex-direction:column; gap:10px;
  }
  .topbar-search-mobile.show{ display:flex; }
  .topbar-search-mobile-row{ display:flex; align-items:center; gap:10px; }
  .topbar-search-mobile .topbar-search{ margin:0; max-width:none; flex:1; }
  .topbar-search-mobile .search-results{ position:static; box-shadow:none; border:none; background:transparent; padding:0; max-height:calc(100vh - var(--topbar-h) - 70px); }
  .topbar-search-mobile .search-results-group-title,
  .topbar-search-mobile .search-results-empty,
  .topbar-search-mobile .search-results-hint{ color:rgba(255,255,255,0.6); }
  .topbar-search-mobile .search-result-item .sr-title{ color:#fff; }
  .topbar-search-mobile .search-result-item .sr-meta{ color:rgba(255,255,255,0.65); }
  .topbar-search-mobile .search-result-item:hover{ background:rgba(255,255,255,0.1); }
  .topbar-search-mobile-close{
    width:36px;height:36px; border-radius:10px; flex:none; cursor:pointer;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .topbar-search-mobile-close svg{ width:16px;height:16px; }
  .sidenav-add-btn{
    width:100%; margin-top:10px; flex:none;
    appearance:none; border:none; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-weight:800; font-size:14px; color:#fff; background:var(--blue-700);
    padding:12px 14px; border-radius:12px; box-shadow:0 4px 14px rgba(51,82,107,0.25);
    transition:.15s ease;
  }
  .sidenav-add-btn:hover{ background:var(--blue-900); transform:translateY(-1px); }
  .sidenav-add-btn svg{ width:16px;height:16px; }
  .hamburger-wrap{ position:relative; }
  .hamburger-btn{
    /* 觸控:原本 36×36px 偏小,調到建議的 44×44px 最小觸控尺寸 */
    width:44px;height:44px;border-radius:12px; flex:none; cursor:pointer;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2);
    display:flex; align-items:center; justify-content:center; transition:.15s ease;
  }
  .hamburger-btn:hover{ background:rgba(255,255,255,0.22); }
  .hamburger-btn svg{ width:17px;height:17px; color:#fff; }
  .hamburger-menu{
    position:absolute; top:calc(100% + 10px); right:0; min-width:200px;
    background:#fff; border-radius:14px; box-shadow:0 16px 40px rgba(30,45,55,0.28);
    border:1px solid var(--border); padding:8px; z-index:120;
    opacity:0; visibility:hidden; transform:translateY(-6px);
    transition:opacity .16s ease, transform .16s ease, visibility .16s;
  }
  .hamburger-wrap:hover .hamburger-menu,
  .hamburger-menu.force-open{
    opacity:1; visibility:visible; transform:translateY(0);
  }
  .hamburger-menu::before{
    content:''; position:absolute; top:-6px; right:14px; width:12px;height:12px;
    background:#fff; transform:rotate(45deg); border-left:1px solid var(--border); border-top:1px solid var(--border);
  }
  .hmenu-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    appearance:none; border:none; background:transparent; cursor:pointer; font-family:inherit;
    font-size:13.5px; font-weight:600; color:var(--blue-900); padding:10px 12px; border-radius:9px;
  }
  .hmenu-item:hover{ background:var(--blue-050); }
  .hmenu-item svg{ width:16px;height:16px; color:var(--blue-700); flex:none; }
  .hmenu-item:disabled{ color:var(--text-faint); cursor:not-allowed; }
  .hmenu-item:disabled svg{ color:var(--text-faint); }
  .hmenu-item:disabled:hover{ background:transparent; }
  .hmenu-item.danger{ color:var(--red); }
  .hmenu-item.danger svg{ color:var(--red); }
  .hmenu-item.danger:hover{ background:var(--red-bg); }
  .hmenu-sep{ height:1px; background:var(--border); margin:6px 4px; }
  .hmenu-label{ font-size:11.5px; font-weight:800; color:var(--text-muted); padding:8px 12px 2px; }
  .notif-badge{
    position:absolute; top:-3px; right:-3px; min-width:16px; height:16px; padding:0 4px;
    border-radius:20px; background:var(--red); color:#fff; font-size:10px; font-weight:800;
    display:flex; align-items:center; justify-content:center; line-height:1;
    box-shadow:0 0 0 2px var(--blue-800);
  }
  .notif-menu{ min-width:300px; max-height:360px; overflow-y:auto; }
  .notif-menu-title{ font-size:12.5px; font-weight:800; color:var(--blue-900); padding:6px 10px 10px; }
  .notif-item{
    display:flex; flex-direction:column; gap:2px; width:100%; text-align:left;
    appearance:none; border:none; background:transparent; cursor:pointer; font-family:inherit;
    padding:9px 12px; border-radius:9px;
  }
  .notif-item:hover{ background:var(--blue-050); }
  .notif-item .nt{ font-size:13px; font-weight:700; color:var(--blue-900); }
  .notif-item .nm{ font-size:11.5px; color:var(--text-muted); }
  .notif-item.is-overdue .nt{ color:var(--red); }
  .notif-item.is-overdue .nm{ color:var(--red); }
  .notif-empty{ padding:22px 10px; text-align:center; color:var(--text-muted); font-size:12.5px; }
  .topbar-user{ display:flex; align-items:center; gap:12px; }
  .topbar-user .avatar{
    width:34px;height:34px;border-radius:50%; flex:none;
    background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.25);
    display:flex;align-items:center;justify-content:center; font-weight:700; font-size:13.5px; color:#fff;
    overflow:hidden;
  }
  .topbar-user .avatar img{ width:100%;height:100%;object-fit:cover; }
  .topbar-user .info{ display:flex; flex-direction:column; line-height:1.35; text-align:right; }
  .topbar-user .name{ font-size:13.5px; font-weight:700; color:#fff; outline:none; cursor:text; border-radius:5px; padding:1px 4px; margin:-1px -4px; }
  .topbar-user .name:hover{ background:rgba(255,255,255,0.12); }
  .topbar-user .name:focus{ background:rgba(255,255,255,0.18); box-shadow:0 0 0 1.5px rgba(255,255,255,0.4); }
  .topbar-user .time{ font-size:11px; color:rgba(255,255,255,0.62); }

  /* ---------- Sidebar Nav ---------- */
  .sidenav{
    position:fixed; left:0; top:var(--topbar-h); bottom:0; width:var(--sidebar-w); z-index:50;
    background:var(--sidebar-bg);
    border-right:1px solid var(--blue-200);
    display:flex; flex-direction:column;
    padding:18px 12px;
    transition:width .2s ease;
  }
  .nav-collapse-btn{
    appearance:none; border:none; cursor:pointer; width:100%;
    background:transparent; color:var(--blue-800);
    font-family:inherit; font-size:13px; font-weight:700;
    padding:9px 14px; border-radius:11px; margin-bottom:10px;
    transition:.18s ease;
    display:flex; flex-direction:row; align-items:center; gap:11px;
    text-align:left; white-space:nowrap;
  }
  .nav-collapse-btn:hover{ background:rgba(255,255,255,0.55); }
  .nav-collapse-btn svg{ width:16px;height:16px; flex:none; transition:transform .2s ease; }
  .nav-tabs{ display:flex; flex-direction:column; gap:4px; flex:1; padding-left:12px; border-left:2px solid var(--blue-100); margin-left:6px; }
  .nav-tab{
    appearance:none; border:none; cursor:pointer; width:100%;
    background:transparent; color:var(--blue-900);
    font-family:inherit; font-size:13.5px; font-weight:700;
    padding:11px 12px; border-radius:11px;
    transition:.18s ease;
    display:flex; flex-direction:row; align-items:center; gap:9px;
    text-align:left; white-space:nowrap;
  }
  .nav-tab:not(.active):hover{ background:var(--sky); }
  .nav-tab.active:hover{ filter:brightness(1.06); }
  .nav-tab.active{ box-shadow:0 4px 12px rgba(47,65,86,0.3); }
  .nav-tab svg{width:18px;height:18px;flex:none;}
  .nav-tab span.label{ writing-mode:horizontal-tb; display:inline-block; }
  .nav-meta{ font-size:11.5px; color:var(--text-muted); white-space:nowrap; padding:10px 12px 4px; display:flex; align-items:center; }
  .workspace-switcher{ position:relative; margin-bottom:12px; }
  .ws-trigger{
    width:100%; appearance:none; border:none; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; gap:8px; text-align:left;
    background:var(--navy);
    color:#fff; border-radius:11px; padding:0 12px; height:42px;
    box-shadow:0 4px 12px rgba(154,111,46,0.35);
    transition:filter .15s ease;
  }
  .ws-trigger:hover{ filter:brightness(1.08); }
  .ws-trigger .ws-pin{ width:17px;height:17px; flex:none; }
  .ws-trigger .ws-label{ flex:1; font-size:13px; font-weight:800; letter-spacing:.3px; white-space:nowrap; }
  .ws-trigger .ws-arrow{ width:15px;height:15px; flex:none; transition:transform .15s ease; }
  .workspace-switcher.open .ws-arrow{ transform:rotate(180deg); }
  .ws-menu{
    position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:70;
    background:#fff; border-radius:12px; box-shadow:0 14px 34px rgba(30,45,55,0.24);
    border:1px solid var(--border); padding:6px;
    opacity:0; visibility:hidden; transform:translateY(-6px);
    transition:opacity .15s ease, transform .15s ease, visibility .15s;
  }
  .workspace-switcher.open .ws-menu{ opacity:1; visibility:visible; transform:translateY(0); }
  .ws-menu-item{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    appearance:none; border:none; background:transparent; cursor:pointer; font-family:inherit;
    font-size:13px; font-weight:700; color:var(--blue-900); padding:9px 10px; border-radius:9px;
  }
  .ws-menu-item:hover{ background:var(--blue-050); }
  .ws-menu-item.active{ background:var(--sky); color:var(--navy); }
  .sync-dot{
    width:7px;height:7px;border-radius:50%; display:inline-block; margin-right:6px; flex:none;
    background:var(--teal); box-shadow:0 0 0 3px rgba(86,124,141,0.2);
  }

  /* ---------- Sidebar collapse ---------- */
  #pages{ transition:margin-left .2s ease; }
  body.sidebar-collapsed{ --sidebar-w:76px; }
  body.sidebar-collapsed .page{ max-width:1620px; }
  body.sidebar-collapsed .nav-tab span.label,
  body.sidebar-collapsed .nav-collapse-btn span.label,
  body.sidebar-collapsed .nav-meta span.label,
  body.sidebar-collapsed .workspace-switcher,
  body.sidebar-collapsed .sidenav-add-btn span.label{ display:none; }
  body.sidebar-collapsed .nav-tab{ justify-content:center; padding:11px 8px; }
  body.sidebar-collapsed .nav-tabs{ padding-left:0; border-left:none; margin-left:0; }
  .home-tab{ border:1px solid var(--blue-200); }
  body.sidebar-collapsed .nav-collapse-btn{ justify-content:center; }
  body.sidebar-collapsed .nav-collapse-btn svg{ transform:rotate(180deg); }
  body.sidebar-collapsed .nav-meta{ justify-content:center; padding:10px 0 4px; }
  body.sidebar-collapsed .nav-meta .sync-dot{ margin-right:0; }

  /* ---------- Layout ---------- */
  #pages{ margin-left:var(--sidebar-w); margin-top:var(--topbar-h); min-height:calc(100vh - var(--topbar-h)); overflow-x:hidden; }
  .page{ max-width:1320px; margin:0 auto; padding:28px 28px 80px; display:none; }
  .page.active{ display:block; animation:slidein .32s cubic-bezier(.22,.61,.36,1); }
  @keyframes slidein{ from{opacity:0; transform:translateX(22px);} to{opacity:1; transform:translateX(0);} }

  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  .page-title{ font-size:21px; font-weight:800; color:var(--blue-900); display:flex; align-items:center; gap:12px; white-space:nowrap; }
  .page-title-icon{ width:38px;height:38px;border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none; }
  .page-title-icon svg{ width:19px; height:19px; display:block; }
  .page-sub{ font-size:13px; color:var(--text-muted); margin-top:5px; font-weight:400; white-space:nowrap;}

  .btn{
    appearance:none; border:none; cursor:pointer; font-family:inherit;
    font-weight:700; font-size:14px; border-radius:10px; padding:10px 18px;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap; flex:none;
    transition:.15s ease;
  }
  .btn-primary{ background:var(--blue-700); color:#fff; }
  .btn-primary:hover{ background:var(--blue-900); }
  .btn-ghost{ background:var(--blue-050); color:var(--blue-800); border:1px solid var(--border); }
  .btn-ghost:hover{ background:var(--blue-100); }
  .btn-danger{ background:var(--red-bg); color:var(--red); }
  .btn-danger:hover{ background:var(--red-soft); }
  .btn-sm{ padding:6px 12px; font-size:12.5px; border-radius:8px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  /* ---------- Cards ---------- */
  .card{
    background:var(--card); border-radius:16px; box-shadow:var(--shadow);
    border:1px solid var(--border);
  }
  .stat-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;
  }
  .stat-card{
    padding:16px 18px 15px; position:relative; overflow:hidden; cursor:pointer;
    transition:.18s ease;
  }
  .stat-card:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(62,90,112,0.14); }
  .stat-card .stat-icon{
    width:30px;height:30px;border-radius:9px; display:flex; align-items:center; justify-content:center;
    margin-bottom:10px;
  }
  .stat-card .stat-icon svg{width:16px;height:16px;}
  .stat-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .stat-label{ font-size:12.5px; color:var(--text-muted); font-weight:600; white-space:nowrap; }
  .stat-value{ font-size:30px; font-weight:800; color:var(--blue-900); line-height:1.1;}
  .stat-value small{ font-size:14px; font-weight:700; color:var(--text-muted); margin-left:2px;}
  .stat-accent-bar{ position:absolute; left:0; top:0; bottom:0; width:4px; }

  .stat-card.is-active{ box-shadow:0 0 0 2px var(--blue-700) inset, 0 8px 20px rgba(62,90,112,0.14); }
  .mini-stat-row{ display:flex; align-items:center; justify-content:center; gap:10px; padding:10px 0 4px; }
  .mini-stat-num{ font-size:38px; font-weight:800; color:var(--blue-900); line-height:1; }
  .mini-stat-suffix{ font-size:14px; font-weight:700; color:var(--text-muted); }
  .mini-stat-link{ text-align:center; font-size:12px; font-weight:700; color:var(--blue-700); margin-top:8px; }
  .mini-stat-sub{ text-align:center; font-size:12px; color:var(--text-muted); margin-top:2px; }

  .chart-row{ display:grid; grid-template-columns:1.1fr 1.4fr; gap:16px; margin-bottom:16px; }
  .panel{ padding:20px 20px 14px; }
  .panel-title{ font-size:14.5px; font-weight:700; color:var(--blue-900); margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;}
  .panel-title .tag{ font-size:11.5px; font-weight:600; color:var(--text-muted); background:var(--blue-050); padding:3px 9px; border-radius:20px;}

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }

  /* ---------- Table ---------- */
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{
    text-align:left; padding:10px 12px; color:var(--text-muted); font-weight:700;

/* ---------------- Firebase-backed storage layer ----------------
   取代原本的 window.storage(Claude artifact 專屬 API)。
   資料存放路徑:users/{Google帳號UID}/appData/{key}
   ---------------------------------------------------------------- */
let currentUid = null;
async function fbStorageGet(key){
  if(!currentUid) return null;
  const snap = await fbDb.collection('users').doc(currentUid).collection('appData').doc(key).get();
  if(!snap.exists) return null;
  const data = snap.data();
  return { key, value: data.value, shared:false };
}
async function fbStorageSet(key, value){
  if(!currentUid) return null;
  await fbDb.collection('users').doc(currentUid).collection('appData').doc(key).set({ value, updatedAt: Date.now() });
  return { key, value, shared:false };
}

const uid = () => 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const money = (n) => '$' + (Math.round(Number(n)||0)).toLocaleString('zh-TW');
const pad2 = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
function parseAmountStr(s){
  if(s==null) return 0;
  s = String(s).trim();
  if(!s || s==='-') return 0;
  s = s.replace(/[$,\s]/g,'');
  const n = Number(s);
  return isNaN(n) ? 0 : n;
}
function parseSlashDate(s){
  if(!s) return '';
  s = String(s).trim();
  if(!s) return '';
  const m = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
  if(!m) return s;
  return `${m[1]}-${pad2(Number(m[2]))}-${pad2(Number(m[3]))}`;
}
function derivePriorityFromDueDate(isoDate){
  if(!isoDate) return '待處理';
  const d = new Date(isoDate+'T12:00:00');
  if(isNaN(d.getTime())) return '待處理';
  const [wStart,wEnd] = weekRange();
  if(d>=wStart && d<=wEnd) return '本週';
  const [mStart,mEnd] = monthRange();
  if(d>=mStart && d<=mEnd) return '本月';
  return '待處理';
}

async function loadAll(){
  setSync('同步中…');
  const results = await Promise.all(Object.entries(STORE_KEYS).map(async ([k,key])=>{
    try{
      const r = await fbStorageGet(key);
      return [k, r ? JSON.parse(r.value) : []];
    }catch(e){ return [k, []]; }
  }));
  results.forEach(([k,v])=> DATA[k]=v||[]);
  const migrated = migrateLegacyInstallmentData();
  setSync('已同步');
  updateTopbarTime();
  if(migrated) persist('projects');
}

/* 舊資料相容:把沒有年度概念的 installmentReceived 陣列,歸到「合約起始年」,
   轉成 installmentReceivedByYear = { "2026": [...], ... },讓每個年度的收款狀態分開記錄。 */
function migrateLegacyInstallmentData(){
  let changed = false;
  (DATA.projects||[]).forEach(p=>{
    if(Array.isArray(p.installmentReceived) && p.installmentReceived.length && !p.installmentReceivedByYear){
      const startYear = p.startDate ? new Date(normDate(p.startDate)+'T00:00:00').getFullYear() : new Date().getFullYear();
      p.installmentReceivedByYear = { [String(startYear)]: p.installmentReceived.slice() };
      delete p.installmentReceived;
      changed = true;
    }
  });
  /* 再把「每年重複套用同一組月份」的舊模式,展開成逐筆「年度＋月份＋金額」的明確清單,
     這樣才能處理跨年度金額或月份不同的情況(例如三年期、每年一月各繳一次,金額不必然均分)。 */
  (DATA.projects||[]).forEach(p=>{
    if(!isMaintenanceProject(p)) return;
    if(Array.isArray(p.installments)) return; // 已是新格式
    const months = p.installmentMonths || [];
    if(!months.length){ p.installments = []; changed = true; return; }
    const startYear = p.startDate ? new Date(normDate(p.startDate)+'T00:00:00').getFullYear() : new Date().getFullYear();
    const endYear = p.endDate ? new Date(normDate(p.endDate)+'T00:00:00').getFullYear() : startYear;
    const auto = p.autoSplit !== false;
    const contractAmt = Number(p.contractAmount)||0;
    const evenAmt = contractAmt/(months.length||1);
    const built = [];
    for(let y=startYear; y<=endYear; y++){
      const receivedArr = (p.installmentReceivedByYear && p.installmentReceivedByYear[String(y)]) || [];
      months.forEach((m, idx)=>{
        built.push({
          id: uid(), year:y, month:Number(m)||1,
          amount: auto ? evenAmt : (Number((p.installmentAmounts||[])[idx])||0),
          received: !!receivedArr[idx],
        });
      });
    }
    built.sort((a,b)=> a.year-b.year || a.month-b.month);
    p.installments = built;
    delete p.installmentMonths;
    delete p.installmentAmounts;
    delete p.installmentReceivedByYear;
    delete p.autoSplit;
    changed = true;
  });
  return changed;
}

async function persist(key){
  try{
    await fbStorageSet(STORE_KEYS[key], JSON.stringify(DATA[key]));
    setSync('已同步');

  }catch(e){
    setSync('儲存失敗,稍後重試');
    console.error(e);
  }
}

/* ---------------- 導覽:把目前頁面／工作區同步到網址列 ----------------
   格式:#<workspace>/<page>,例如 #pm/receivables、#sales/todos。
   用 replaceState 而不是直接改 location.hash,避免每次切換頁面都往瀏覽器
   歷史紀錄多塞一筆(那個交給下一步的上一頁/下一頁支援再處理),
   但網址仍會即時反映目前位置,重新整理或分享連結都能回到同一頁。 */
function updateUrlHash(push){
  const hash = '#' + currentWorkspace + '/' + currentPage;
  if(location.hash === hash) return;
  if(push){
    history.pushState(null, '', hash);
  } else {
    history.replaceState(null, '', hash);
  }
}
function parseUrlHash(){
  const h = location.hash.replace(/^#/, '');
  if(!h) return null;
  const [ws, page] = h.split('/');
  if(ws!=='sales' && ws!=='pm') return null;
  return { ws, page: page || 'dashboard' };
}

async function switchWorkspace(ws, opts){
  if(ws===currentWorkspace) return;
  currentWorkspace = ws;
  saveWorkspace(ws);
  updateWorkspaceMenuUI();
  const validIds = getCurrentNav().map(n=>n.id);
  if(!validIds.includes(currentPage)) currentPage = 'dashboard';
  renderNav();
  renderPage();
  const pushHistory = !opts || opts.pushHistory !== false;
  updateUrlHash(pushHistory);
  toast(ws==='pm' ? '已切換至「專案管理」工作區' : '已切換至「業務執行」工作區');
}

/* ---------------- Toast ---------------- */
let toastTimer=null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

/* ---------------- Confirm Dialog (站內確認視窗,取代原本的 window.confirm) ----------------
   表單與回饋:原生 confirm()/alert() 的樣式跟整體設計不一致,手機上體驗也差。
   改成沿用既有的 Modal 系統(#modalOverlay/#modalBox),並回傳 Promise,
   呼叫端可以維持原本 if(await confirmDialog(...)) 的寫法。
   因為走同一套 openModalOverlay()/closeModal(),前面做好的鍵盤焦點管理、
   Tab 鍵鎖定、Esc 關閉都會自動套用在這個對話框上。 */
function confirmDialog({ title, message, confirmLabel, cancelLabel, danger }){
  return new Promise(resolve=>{
    const box = document.getElementById('modalBox');
    box.className = 'modal';
    box.innerHTML = `
      <div class="modal-head">
        <div class="modal-title">${esc(title||'請確認')}</div>
        <button class="modal-close" id="cdClose" aria-label="關閉視窗">${ICONS.close}</button>
      </div>
      <div class="modal-body">
        <div style="font-size:13.5px;color:var(--text);line-height:1.7;">${esc(message||'')}</div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="cdCancel">${esc(cancelLabel||'取消')}</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" id="cdConfirm">${esc(confirmLabel||'確定')}</button>
      </div>
    `;
    openModalOverlay();
    // 危險操作預設把焦點放在「取消」上,避免使用者手滑誤觸確定
    if(danger){
      const cancelBtn = document.getElementById('cdCancel');
      if(cancelBtn) cancelBtn.focus();
    }
    let settled = false;
    function finish(result){
      if(settled) return;
      settled = true;
      document.removeEventListener('keydown', escHandler);
      document.getElementById('modalOverlay').removeEventListener('click', overlayHandler);
      closeModal();
      resolve(result);
    }
    function escHandler(e){
      if(e.key==='Escape') finish(false);
    }
    function overlayHandler(e){
      if(e.target.id==='modalOverlay') finish(false);
    }
    document.addEventListener('keydown', escHandler);
    document.getElementById('modalOverlay').addEventListener('click', overlayHandler);
    document.getElementById('cdClose').addEventListener('click', ()=> finish(false));
    document.getElementById('cdCancel').addEventListener('click', ()=> finish(false));
    document.getElementById('cdConfirm').addEventListener('click', ()=> finish(true));
  });
}

/* ---------------- 表單欄位驗證(欄位旁即時錯誤提示) ----------------
   表單與回饋:必填欄位漏填時,原本只跳一個 toast,使用者要自己找是哪一欄。
   這裡改成在欄位旁顯示紅框 + 錯誤文字,並方便呼叫端把焦點移到第一個有問題的欄位。 */
function markFieldError(inputEl, msg){
  if(!inputEl) return;
  inputEl.style.borderColor = 'var(--red)';
  inputEl.setAttribute('aria-invalid', 'true');
  const field = inputEl.closest('.form-field');
  if(field && msg){
    let errEl = field.querySelector('.field-error');
    if(!errEl){
      errEl = document.createElement('div');
      errEl.className = 'field-error';
      errEl.style.cssText = 'font-size:11.5px;color:var(--red);font-weight:700;';
      field.appendChild(errEl);
    }
    errEl.textContent = msg;
  }
}
function clearFieldError(inputEl){
  if(!inputEl) return;
  inputEl.style.borderColor = '';
  inputEl.removeAttribute('aria-invalid');
  const field = inputEl.closest('.form-field');
  const errEl = field && field.querySelector('.field-error');
  if(errEl) errEl.remove();
}
function clearAllFieldErrors(container){
  container.querySelectorAll('.field-error').forEach(el=>el.remove());
  container.querySelectorAll('[aria-invalid]').forEach(el=>{ el.removeAttribute('aria-invalid'); el.style.borderColor=''; });
}

/* ---------------- Touch-friendly click-to-open menus ----------------
   觸控與互動:漢堡選單／通知選單原本只靠 CSS :hover 展開,觸控裝置(手機/平板)
   沒有 hover,選單可能完全打不開。這裡加上點擊切換,滑鼠使用者仍可沿用原本的
   hover 展開(CSS 沒有改動),點擊會額外加上 .force-open,並同步更新 aria-expanded。 */
function setupClickMenu(wrapId, btnId, menuId){
  const wrap = document.getElementById(wrapId);
  const btn = document.getElementById(btnId);
  const menu = document.getElementById(menuId);
  if(!wrap || !btn || !menu) return;
  function closeAllOtherMenus(){
    document.querySelectorAll('.hamburger-menu.force-open').forEach(m=>{
      if(m===menu) return;
      m.classList.remove('force-open');
      const otherWrap = m.closest('.hamburger-wrap');
      const otherBtn = otherWrap && otherWrap.querySelector('button.hamburger-btn');
      if(otherBtn) otherBtn.setAttribute('aria-expanded', 'false');
    });
  }
  function setOpen(open){
    menu.classList.toggle('force-open', open);
    btn.setAttribute('aria-expanded', String(open));
  }
  btn.addEventListener('click', e=>{
    e.stopPropagation();
    const willOpen = !menu.classList.contains('force-open');
    closeAllOtherMenus();
    setOpen(willOpen);
  });
  // 點擊選單內任一按鈕(匯出備份、登出、通知項目...)後自動收合選單,避免觸控裝置上選單一直開著
  menu.addEventListener('click', e=>{
    if(e.target.closest('button')) setOpen(false);
  });
  document.addEventListener('click', e=>{
    if(!wrap.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') setOpen(false);
  });
}

function getNotificationItems(){
  const now = new Date();
  const soon = new Date(now); soon.setDate(soon.getDate()+3);
  const items = [];
  DATA.todos.forEach(t=>{
    if(t.done || !t.dueDate) return;

/* ============================================================
   DASHBOARD
   ============================================================ */
function weekRange(d=new Date()){
  const day = d.getDay(); // 0 Sun .. 6 Sat
  const diffToMon = (day===0? -6 : 1-day);
  const mon = new Date(d); mon.setDate(d.getDate()+diffToMon); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
  return [mon, sun];
}
function monthRange(d=new Date()){
  const start = new Date(d.getFullYear(), d.getMonth(), 1, 0,0,0);
  const end = new Date(d.getFullYear(), d.getMonth()+1, 0, 23,59,59);
  return [start,end];
}
function inRange(dateStr, start, end){
  if(!dateStr) return false;
  const t = new Date(dateStr+'T12:00:00').getTime();
  return t>=start.getTime() && t<=end.getTime();
}

function isMaintenanceProject(p){ return (p.projType||'maintenance')==='maintenance'; }

function getAllInstallments(){
  // 應收帳款只抓「維護專案」分頁的資料,且只顯示「今年」的收款項目;
  // 期數分子/分母改用「該專案全部年度的收款總期數」計算,而不是只看今年度的筆數,
  // 避免像「三年期、每年1月收一次」這種情況,今年只看到1筆就誤判成 1/1。
  const list = [];
  const thisYear = new Date().getFullYear();
  DATA.projects.forEach(p=>{
    if(!isMaintenanceProject(p)) return;
    const allInsts = (p.installments||[]).slice().sort((a,b)=> a.year-b.year || a.month-b.month);
    const total = allInsts.length;
    allInsts.forEach((inst, idx)=>{
      if(inst.year !== thisYear) return;
      list.push({ projectId:p.id, instId:inst.id, year:thisYear, client:p.client, name:p.name, code:p.code, pm:p.pm, sales:p.sales,
        period:idx+1, total, month:Number(inst.month), amount:Number(inst.amount)||0, received: !!inst.received });
    });
  });
  return list;
}

/* 逾期未收款:本年度已經過了開款月份、卻尚未勾選已收的款項,不受月份篩選影響 */
function computeOverdueReceivables(){
  const now = new Date();
  const curMonth = now.getMonth()+1;
  return getAllInstallments()
    .filter(r=> !r.received && r.month < curMonth)
    .sort((a,b)=> a.month - b.month);
}

function toggleInstallmentReceived(projectId, instId, checked){
  const p = DATA.projects.find(x=>x.id===projectId);
  if(!p || !Array.isArray(p.installments)) return;
  const inst = p.installments.find(i=>i.id===instId);
  if(!inst) return;
  inst.received = checked;
  persist('projects');
}

/* 容錯日期正規化:把 20260531 / 2026/05/31 等格式統一轉成 2026-05-31,
   避免日期比較(逾期／到期判斷)因格式不同而被誤判為 Invalid Date。 */
function normDate(s){
  if(!s) return '';
  s = String(s).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  let m = s.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})$/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  const d = new Date(s);
  if(!isNaN(d.getTime())) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return '';
}

/* 即將到期專案:維護專案看「合約到期日」,進行中專案(保固中)看「保固到期」。
   進行中專案在開發中階段尚無保固到期日,因此不會出現在到期清單,等驗收後填入保固到期日才會被追蹤。 */
function getProjectExpiryInfo(p){
  if(!isMaintenanceProject(p)){
    return { date: normDate(p.warrantyEndDate), label: '保固到期' };
  }
  return { date: normDate(p.endDate), label: '合約到期' };
}

function computeUpcomingExpiring(monthsAhead=3){
  const now = new Date(); now.setHours(0,0,0,0);
  const future = new Date(now); future.setMonth(future.getMonth()+monthsAhead);
  return DATA.projects.map(p=>{
    const info = getProjectExpiryInfo(p);
    return Object.assign({}, p, { _expiryDate: info.date, _expiryLabel: info.label });
  }).filter(p=>{
    if(!p._expiryDate || p.terminated) return false;
    const d = new Date(p._expiryDate+'T00:00:00');
    return d>=now && d<=future;
  }).sort((a,b)=> (a.code||'').localeCompare(b.code||'', undefined, {numeric:true, sensitivity:'base'}));
}

/* 已逾期但尚未標記完成的到期／保固項目:不受 3 個月時間窗限制,避免拖久了從清單消失 */
function computeOverdueExpiring(){
  const now = new Date(); now.setHours(0,0,0,0);
  return DATA.projects.map(p=>{
    const info = getProjectExpiryInfo(p);
    return Object.assign({}, p, { _expiryDate: info.date, _expiryLabel: info.label });
  }).filter(p=>{
    if(!p._expiryDate || p.terminated || p.renewalDone) return false;
    const d = new Date(p._expiryDate+'T00:00:00');
    return d < now;
  }).sort((a,b)=> (a._expiryDate||'').localeCompare(b._expiryDate||''));
}

/* 即將到期專案頁面實際顯示的清單:已逾期(不限時間窗)＋ 未來 monthsAhead 個月內到期(含已標記完成的項目,供對照) */
function computeExpiringPageList(monthsAhead=3){
  const now = new Date(); now.setHours(0,0,0,0);
  const overdue = computeOverdueExpiring();
  const upcoming = computeUpcomingExpiring(monthsAhead);
  const map = new Map();
  overdue.forEach(p=> map.set(p.id, Object.assign({}, p, { _isOverdue:true })));
  upcoming.forEach(p=>{
    if(map.has(p.id)) return;
    const d = new Date(p._expiryDate+'T00:00:00');
    map.set(p.id, Object.assign({}, p, { _isOverdue: d < now }));
  });
  return Array.from(map.values());
}

function computeStats(){
  const now = new Date();
  const [wStart,wEnd] = weekRange(now);
  const [mStart,mEnd] = monthRange(now);
  const todos = DATA.todos;

  const totalOpen = todos.filter(t=>!t.done).length;

  const weekTodos = todos.filter(t=> inRange(t.dueDate, wStart, wEnd));
  const weekDone = weekTodos.filter(t=>t.done).length;
  const weekOpen = weekTodos.length - weekDone;
  const weekRate = weekTodos.length ? Math.round(weekDone/weekTodos.length*100) : 0;

  const monthTodos = todos.filter(t=> inRange(t.dueDate, mStart, mEnd));
  const monthDone = monthTodos.filter(t=>t.done).length;
  const monthOpen = monthTodos.length - monthDone;
  const monthRate = monthTodos.length ? Math.round(monthDone/monthTodos.length*100) : 0;

  const overdue = todos.filter(t=> !t.done && t.dueDate && new Date(t.dueDate+'T23:59:59') < now).length;

  // current month receivables (for dashboard mini card)
  const curMonth = now.getMonth()+1;
  const receivables = getAllInstallments().filter(x=>x.month===curMonth);
  const receivablesTotal = receivables.reduce((s,r)=>s+r.amount,0);

  const upcomingExpiring = computeUpcomingExpiring(3);

  return {totalOpen, weekOpen, weekRate, weekTotal:weekTodos.length, monthOpen, monthRate, monthTotal:monthTodos.length, overdue, receivables, receivablesTotal, upcomingExpiring, activeProjects: DATA.projects.filter(p=>!p.terminated).length};
}

/* ---------- lightweight inline SVG chart helper (no external chart library needed) ---------- */
function gaugeSVG(pct, color, size){
  size = size || 168;
  const r = 58, cx = 80, cy = 80, sw = 16;
  const C = 2*Math.PI*r;
  const clamped = Math.max(0, Math.min(100, pct));
  const dash = (clamped/100)*C;
  return `<svg viewBox="0 0 160 160" width="${size}" height="${size}" style="max-width:100%;" role="img" aria-label="完成率 ${clamped}%">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--blue-100)" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${dash.toFixed(1)} ${(C-dash).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="30" font-weight="800" fill="var(--blue-900)" font-family="Microsoft JhengHei, sans-serif">${clamped}%</text>
  </svg>`;
}

    statCardHtml({label:'逾期事項', value:s.overdue, icon:ICONS.alert, color:'var(--red)', bg:'var(--red-bg)', accent:'var(--red)', onClick:'todos:overdue'}),
  ].join('');

  document.querySelectorAll('[data-goto]').forEach(card=>{
    card.addEventListener('click', async ()=>{
      const v = card.dataset.goto;
      if(!v) return;
      const [page, filter] = v.split(':');
      const ws = pageWorkspace(page);
      if(ws && ws!==currentWorkspace){
        await switchWorkspace(ws, { pushHistory:false });
      }
      goPage(page, filter);
    });
  });

  // week / month gauges
  const weekDone = s.weekTotal - s.weekOpen;
  const monthDone = s.monthTotal - s.monthOpen;
  document.getElementById('weekGauge').innerHTML = gaugeSVG(s.weekRate, 'var(--red)');
  document.getElementById('weekGaugeSub').textContent = s.weekTotal ? `本週共 ${s.weekTotal} 筆,已完成 ${weekDone} 筆` : '本週尚無到期待辦';
  document.getElementById('monthGauge').innerHTML = gaugeSVG(s.monthRate, 'var(--blue-700)');
  document.getElementById('monthGaugeSub').textContent = s.monthTotal ? `本月共 ${s.monthTotal} 筆,已完成 ${monthDone} 筆` : '本月尚無到期待辦';

  // PM mini cards row (receivables / expiring) — always shown regardless of current workspace
  document.getElementById('receivCount').textContent = s.receivables.length;
  document.getElementById('receivAmountSub').textContent = s.receivables.length ? `預計收款 ${money(s.receivablesTotal)}` : '本月無應收款項目';

  document.getElementById('expiringCount').textContent = s.upcomingExpiring.length;
  const buckets = [0,0,0];
  const nowRef = new Date();
  s.upcomingExpiring.forEach(p=>{
    const d = new Date(normDate(p._expiryDate)+'T00:00:00');
    const diff = (d.getFullYear()-nowRef.getFullYear())*12+(d.getMonth()-nowRef.getMonth());
    if(diff>=0 && diff<3) buckets[diff]++;
  });
  document.getElementById('expiringSub').textContent = s.upcomingExpiring.length
    ? `本月 ${buckets[0]}・下月 ${buckets[1]}・後月 ${buckets[2]}`
    : '近三個月無即將到期專案';
}

/* ============================================================
   GLOBAL SEARCH(全站搜尋:專案／待辦事項／聯絡人／記事)
   直接在前端已載入的 DATA 裡做子字串比對,不分工作區,一次搜四種資料。
   ============================================================ */
const SEARCH_RESULT_LIMIT = 5;

function computeSearchResults(query){
  const q = query.trim().toLowerCase();
  if(!q) return null;

  const matchedProjects = DATA.projects.filter(p=>{
    return [p.client, p.name, p.code, p.pm, p.sales, p.contractNo, p.contact]
      .some(v=> (v||'').toLowerCase().includes(q));
  });
  const matchedTodos = DATA.todos.filter(t=>{
    return [t.title, t.client, t.category, t.note]
      .some(v=> (v||'').toLowerCase().includes(q));
  });
  const matchedContacts = DATA.contacts.filter(c=>{
    return [c.name, c.company, c.role, c.phone, c.email]
      .some(v=> (v||'').toLowerCase().includes(q));
  });
  const matchedNotes = DATA.notes.filter(n=>{
    return [n.title, n.content, n.client, n.category]
      .some(v=> (v||'').toLowerCase().includes(q));
  });

  return {
    projects: matchedProjects.slice(0, SEARCH_RESULT_LIMIT), projectsTotal: matchedProjects.length,
    todos: matchedTodos.slice(0, SEARCH_RESULT_LIMIT), todosTotal: matchedTodos.length,
    contacts: matchedContacts.slice(0, SEARCH_RESULT_LIMIT), contactsTotal: matchedContacts.length,
    notes: matchedNotes.slice(0, SEARCH_RESULT_LIMIT), notesTotal: matchedNotes.length,
  };
}

function searchResultGroupHtml(title, items, total, renderItem){
  if(!items.length) return '';
  const moreHtml = total > items.length
    ? `<div class="search-results-more">還有 ${total - items.length} 筆,請輸入更精確的關鍵字</div>`
    : '';
  return `<div class="search-results-group">
    <div class="search-results-group-title">${esc(title)}(${total})</div>
    ${items.map(renderItem).join('')}
    ${moreHtml}
  </div>`;
}

function renderSearchResultsHtml(query, results){
  if(!results) return '';
  const total = results.projectsTotal + results.todosTotal + results.contactsTotal + results.notesTotal;
  if(total===0){
    return `<div class="search-results-empty">找不到符合「${esc(query.trim())}」的結果</div>`;
  }
  const projectsHtml = searchResultGroupHtml('專案', results.projects, results.projectsTotal, p=>`
    <button type="button" class="search-result-item" role="option" data-type="project" data-id="${esc(p.id)}">
      <span class="sr-title">${esc(p.name)}</span>
      <span class="sr-meta">${esc(p.client)}${p.code?`・${esc(p.code)}`:''}</span>
    </button>`);
  const todosHtml = searchResultGroupHtml('待辦事項', results.todos, results.todosTotal, t=>`
    <button type="button" class="search-result-item" role="option" data-type="todo" data-id="${esc(t.id)}">
      <span class="sr-title">${esc(t.title||'-')}</span>
      <span class="sr-meta">${[t.client, t.dueDate?`到期 ${t.dueDate}`:''].filter(Boolean).map(esc).join('・')}</span>
    </button>`);
  const contactsHtml = searchResultGroupHtml('聯絡人', results.contacts, results.contactsTotal, c=>`
    <button type="button" class="search-result-item" role="option" data-type="contact" data-id="${esc(c.id)}">
      <span class="sr-title">${esc(c.name)}</span>
      <span class="sr-meta">${[c.company, c.role].filter(Boolean).map(esc).join('・')}</span>
    </button>`);
  const notesHtml = searchResultGroupHtml('記事本', results.notes, results.notesTotal, n=>`
    <button type="button" class="search-result-item" role="option" data-type="note" data-id="${esc(n.id)}">
      <span class="sr-title">${esc(n.title||'(無標題)')}</span>
      <span class="sr-meta">${[n.client, n.category].filter(Boolean).map(esc).join('・')}</span>
    </button>`);
  return projectsHtml + todosHtml + contactsHtml + notesHtml;
}

function updateSearchPanel(inputEl, panelEl){
  const query = inputEl.value;
  if(!query.trim()){
    panelEl.classList.remove('show');
    panelEl.innerHTML = '';
    return;
  }
  const results = computeSearchResults(query);
  panelEl.innerHTML = renderSearchResultsHtml(query, results);
  panelEl.classList.add('show');
}

function setupGlobalSearch(inputId, panelId){
  const inputEl = document.getElementById(inputId);
  const panelEl = document.getElementById(panelId);
  if(!inputEl || !panelEl) return;
  inputEl.addEventListener('input', ()=> updateSearchPanel(inputEl, panelEl));
  inputEl.addEventListener('focus', ()=>{ if(inputEl.value.trim()) updateSearchPanel(inputEl, panelEl); });
  panelEl.addEventListener('click', e=>{
    const item = e.target.closest('.search-result-item');
    if(!item) return;
    const { type, id } = item.dataset;
    panelEl.classList.remove('show');
    panelEl.innerHTML = '';
    inputEl.value = '';
    // 手機版搜尋列也一併收起來,直接看到跳轉後的畫面
    const mobileBar = document.getElementById('topbarSearchMobile');
    if(mobileBar) mobileBar.classList.remove('show');
    const toggleBtn = document.getElementById('topbarSearchToggleBtn');
    if(toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
    openSearchResult(type, id);
  });
  document.addEventListener('click', e=>{
    if(!inputEl.contains(e.target) && !panelEl.contains(e.target)) panelEl.classList.remove('show');
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && panelEl.classList.contains('show')){
      panelEl.classList.remove('show');
    }
  });
}

/* 點擊搜尋結果:切到對應工作區＋頁面,並直接開啟該筆資料的預覽／編輯 Modal。
   切工作區那一步不推歷史紀錄,緊接著的 goPage() 才是使用者真正要去的頁面, 
   避免瀏覽器上一頁時卡在一個閃現過的中繼畫面(跟儀表板小卡片的做法一致)。 */
function openSearchResult(type, id){
  if(type==='project'){
    const p = DATA.projects.find(x=>x.id===id);
    if(!p) return;
    projSubTab = p.projType || 'maintenance';
    (async ()=>{
      if(currentWorkspace!=='pm') await switchWorkspace('pm', { pushHistory:false });
      goPage('projects');
      openProjectPreviewModal(id);
    })();
  } else if(type==='todo'){
    (async ()=>{
      if(currentWorkspace!=='sales') await switchWorkspace('sales', { pushHistory:false });
      goPage('todos');
      openTodoModal(id);
    })();
  } else if(type==='contact'){
    (async ()=>{
      if(currentWorkspace!=='sales') await switchWorkspace('sales', { pushHistory:false });
      goPage('contacts');
      openContactModal(id);
    })();
  } else if(type==='note'){
    (async ()=>{
      if(currentWorkspace!=='sales') await switchWorkspace('sales', { pushHistory:false });
      goPage('notes');
      openNoteModal(id);
    })();
  }
}

let expiringFilter = 'all';

function afterExpiringRender(){
  expiringFilter = 'all';
  renderExpiringContent();
}

function renderExpiringContent(){
  const combined = computeExpiringPageList(3); // 已逾期(不限時間窗)＋ 未來3個月到期,各項目帶有 _isOverdue 旗標
  const now = new Date(); now.setHours(0,0,0,0);
  const bucketLabels = [];
  for(let i=0;i<3;i++){
    const ref = new Date(now.getFullYear(), now.getMonth()+i, 1);
    bucketLabels.push(`${ref.getMonth()+1}月`);
  }
  const overdueCount = combined.filter(p=>p._isOverdue).length;
  const buckets = [0,0,0];
  combined.forEach(p=>{
    if(p._isOverdue) return;
    const d = new Date(p._expiryDate+'T00:00:00');
    const diff = (d.getFullYear()-now.getFullYear())*12+(d.getMonth()-now.getMonth());
    if(diff>=0 && diff<3) buckets[diff]++;
  });

  const cardDefs = [
    {bucket:'overdue', label:'已逾期', value:overdueCount, icon:ICONS.alert, color:'var(--red)', bg:'var(--red-bg)', accent:'var(--red)'},
    {bucket:0, label:`${bucketLabels[0]}到期`, value:buckets[0], icon:ICONS.calendar, color:'var(--blue-800)', bg:'var(--blue-100)', accent:'var(--blue-700)'},
    {bucket:1, label:`${bucketLabels[1]}到期`, value:buckets[1], icon:ICONS.calendar, color:'var(--blue-800)', bg:'var(--blue-100)', accent:'var(--blue-700)'},
    {bucket:2, label:`${bucketLabels[2]}到期`, value:buckets[2], icon:ICONS.calendar, color:'var(--blue-800)', bg:'var(--blue-100)', accent:'var(--blue-500)'},
  ];
  document.getElementById('expiringStatGrid').innerHTML = cardDefs.map(c=>{
    const isActive = expiringFilter===c.bucket;
    const html = statCardHtml({label:c.label, value:c.value, icon:c.icon, color:c.color, bg:c.bg, accent:c.accent});
    return html.replace('class="card stat-card"', `class="card stat-card${isActive?' is-active':''}" data-bucket="${c.bucket}"`);
  }).join('');
  document.querySelectorAll('#expiringStatGrid [data-bucket]').forEach(card=>{
    card.addEventListener('click', ()=>{
      const b = card.dataset.bucket;
      const nextFilter = (b==='overdue') ? 'overdue' : Number(b);
      expiringFilter = (expiringFilter===nextFilter) ? 'all' : nextFilter;
      renderExpiringContent();
    });
  });

  const filtered = expiringFilter==='all' ? combined
    : expiringFilter==='overdue' ? combined.filter(p=>p._isOverdue)
    : combined.filter(p=>{
        if(p._isOverdue) return false;
        const d = new Date(p._expiryDate+'T00:00:00');
        const diff = (d.getFullYear()-now.getFullYear())*12+(d.getMonth()-now.getMonth());
        return diff===expiringFilter;
      });

  document.getElementById('expiringTotalTag').textContent = `共 ${filtered.length} 個專案`;
  const el = document.getElementById('expiringList');
  if(!filtered.length){
    el.innerHTML = emptyState('此範圍內沒有即將到期或逾期的專案', ICONS.calendar);
  } else {
    const sortedFiltered = filtered.slice().sort((a,b)=>{
      if(!!a._isOverdue !== !!b._isOverdue) return a._isOverdue ? -1 : 1;
      if(!!a.renewalDone !== !!b.renewalDone) return a.renewalDone ? 1 : -1;
      return (a._expiryDate||'').localeCompare(b._expiryDate||'');
    });
    el.innerHTML = `<table><thead><tr><th></th><th>來源</th><th>客戶</th><th>合約名稱</th><th>專案代碼</th><th>專案經理</th><th>到期日</th><th></th></tr></thead><tbody>
      ${sortedFiltered.map(p=>{
        const srcBadge = isMaintenanceProject(p)
          ? `<span class="badge badge-gray">維護專案</span>`
          : `<span class="badge badge-blue">進行中專案</span>`;
        return `<tr style="${p.renewalDone?'opacity:.55;':''}">
        <td><label style="display:flex;align-items:center;justify-content:center;padding:10px;cursor:pointer;"><input type="checkbox" class="exp-check" data-pid="${p.id}" ${p.renewalDone?'checked':''} style="width:18px;height:18px;accent-color:${PAGE_THEME.expiring.color};cursor:pointer;" title="標記為已完成" aria-label="標記 ${esc(p.name)} 為已完成"></label></td>
        <td>${srcBadge}</td>
        <td>${esc(p.client)}</td><td><b>${esc(p.name)}</b></td><td class="cell-muted">${esc(p.code)}</td>
        <td>${esc(p.pm)}</td>
        <td class="cell-muted" style="${p._isOverdue?'color:var(--red);font-weight:700;':''}">${esc(p._expiryDate)}${p._isOverdue?' ⚠':''}</td>
        <td><button class="icon-btn" data-addtodo="${p.id}" title="加入待辦事項" aria-label="將 ${esc(p.name)} 加入待辦事項">${ICONS.plus}</button></td>
      </tr>`;}).join('')}
    </tbody></table>`;
    el.querySelectorAll('.exp-check').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const proj = DATA.projects.find(x=>x.id===e.target.dataset.pid);
        if(!proj) return;
        proj.renewalDone = e.target.checked;
        persist('projects');
        if(e.target.checked) openExpiringRenewalDialog(proj);
        renderExpiringContent();
      });
    });
    el.querySelectorAll('[data-addtodo]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const proj = DATA.projects.find(x=>x.id===b.dataset.addtodo);
        if(!proj) return;
        const info = getProjectExpiryInfo(proj);
        openTodoModal(null, {
          client: proj.client, category:'合約', title: proj.name,
          dueDate: info.date || todayISO(),
          priority: derivePriorityFromDueDate(info.date||''),
          note: `${info.label}提醒${proj.code?'('+proj.code+')':''}`,
        });
      });
    });
  }
}

/* 標記已完成後的後續詢問:
   - 維護專案(合約到期):多數情況是續約,因此只給「續約:直接更新這筆專案」(開啟同一筆專案編輯,不會產生重複專案)或「不用,謝謝」。
   - 進行中專案(保固到期):本來就沒有既有維護合約可更新,因此提供「建立維護專案」(新建)或「不用,謝謝」。 */
function openExpiringRenewalDialog(proj){
  const box = document.getElementById('modalBox');
  box.className = 'modal';

  if(isMaintenanceProject(proj)){
    box.innerHTML = `
      <div class="modal-head">
        <div class="modal-title">已標記為完成</div>
        <button class="modal-close" id="mClose" aria-label="關閉視窗">${ICONS.close}</button>
      </div>
      <div class="modal-body">
        <div style="font-size:13.5px;color:var(--text);line-height:1.7;">
          已將「<b>${esc(proj.name)}</b>」標記為完成。這份維護合約是否要續約?選擇續約會直接開啟這筆專案的編輯視窗,方便您更新金額、代碼與新的起訖日,<b>不會另外產生新的專案</b>。
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="mNo">不用,謝謝</button>
        <button class="btn btn-primary" id="mRenew">續約:直接更新這筆專案</button>
      </div>
    `;
    openModalOverlay();
    document.getElementById('mClose').addEventListener('click', closeModal);
    document.getElementById('mNo').addEventListener('click', closeModal);
    document.getElementById('mRenew').addEventListener('click', ()=>{
      closeModal();
      // 進入續約流程即視為已在處理中,先解除完成標記,避免使用者取消編輯後這筆仍被誤判為已處理完成
      proj.renewalDone = false;
      persist('projects');
      if(currentPage==='expiring') renderExpiringContent();
      openMaintenanceProjectModal(proj, true);
    });
    return;
  }

  box.innerHTML = `
    <div class="modal-head">
      <div class="modal-title">已標記為完成</div>
      <button class="modal-close" id="mClose" aria-label="關閉視窗">${ICONS.close}</button>
    </div>
    <div class="modal-body">
      <div style="font-size:13.5px;color:var(--text);line-height:1.7;">
        已將「<b>${esc(proj.name)}</b>」標記為完成,是否需要為這個專案建立「維護專案」合約?
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="mNo">不用,謝謝</button>
      <button class="btn btn-primary" id="mYes">建立維護專案</button>
    </div>
  `;
  openModalOverlay();
  document.getElementById('mClose').addEventListener('click', closeModal);
  document.getElementById('mNo').addEventListener('click', closeModal);
  document.getElementById('mYes').addEventListener('click', ()=>{
    closeModal();
    const prefill = {
      id: uid(), projType:'maintenance', client:proj.client, code:'', name:proj.name, contractAmount:0,
      maintenanceRate:proj.maintenanceRate||'', startDate:todayISO(), endDate:'', modHours:0, modUnitPrice:0, sourceCode:'',
      pm:proj.pm||'', sales:proj.sales||'', terminated:false, note:'', installments:[],
      department:proj.department||'', contractNo:'', contact:proj.contact||'', invoiceNote:'',
      renewalDone:false,
    };
    openMaintenanceProjectModal(prefill, false);
  });
}

function filteredProjects(){
  return DATA.projects.filter(p=>{
    if((p.projType||'maintenance')!==projSubTab) return false;
    if(projFilter.q){
      const q = projFilter.q.toLowerCase();
      const hit = [p.client,p.name,p.code].some(v=>(v||'').toLowerCase().includes(q));
      if(!hit) return false;
    }
    if(projFilter.pm && p.pm!==projFilter.pm) return false;
    if(projFilter.sales && p.sales!==projFilter.sales) return false;
    return true;
  }).sort((a,b)=> (a.code||'').localeCompare(b.code||'', undefined, {numeric:true, sensitivity:'base'}));
}

function afterProjectsRender(){
  renderProjectsTable();
  document.getElementById('pjSearch').addEventListener('input', e=>{ projFilter.q=e.target.value; renderProjectsTable(); });
  document.getElementById('pjPmFilter').addEventListener('change', e=>{ projFilter.pm=e.target.value; renderProjectsTable(); });
  document.getElementById('pjSalesFilter').addEventListener('change', e=>{ projFilter.sales=e.target.value; renderProjectsTable(); });
  document.querySelectorAll('#projSubTabSeg button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.v===projSubTab) return;
      projSubTab = btn.dataset.v;
      projFilter = { q:'', pm:'', sales:'' };
      renderPage();

  });
}

async function confirmDeleteProject(id){
  const p = DATA.projects.find(x=>x.id===id);
  if(!p) return;
  const ok = await confirmDialog({
    title:'刪除專案',
    message:`確定要刪除專案「${p.name}」嗎?此動作無法復原。`,
    confirmLabel:'刪除', cancelLabel:'取消', danger:true,
  });
  if(!ok) return;
  DATA.projects = DATA.projects.filter(x=>x.id!==id);
  persist('projects');
  renderProjectsTable();
  toast('已刪除專案');
}

/* ---------- Project Preview Modal ---------- */
function pvField(label, value, full){
  const hasVal = value!==undefined && value!==null && String(value).trim()!=='';
  return `<div class="form-field${full?' full':''}">
    <label>${label}</label>
    <div class="preview-value${hasVal?'':' empty'}">${hasVal?value:'—'}</div>
  </div>`;
}

function pvInstallmentsTable(p){
  const insts = (p.installments||[]).slice().sort((a,b)=> a.year-b.year || a.month-b.month);
  if(!insts.length) return `<div class="form-field full"><label>收款設定</label><div class="preview-value empty">—</div></div>`;
  const total = insts.reduce((s,i)=>s+(Number(i.amount)||0),0);
  const rows = insts.map((inst,i)=>`<tr><td>第 ${i+1} 期</td><td>${inst.year} 年</td><td>${esc(inst.month)} 月</td><td class="cell-amount">${money(inst.amount||0)}</td></tr>`).join('');
  return `<div class="form-field full">
    <label>收款設定</label>
    <div class="preview-value" style="padding:10px;">
      <table><thead><tr><th>期別</th><th>年度</th><th>月份</th><th>金額</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="cell-muted" style="margin-top:8px;">＊共 ${insts.length} 期,合計 ${money(total)}</div>
    </div>
  </div>`;
}

/* ---------- 專案預覽:相關待辦／相關記事 區塊 ----------
   從 DATA.todos / DATA.notes 依 projectId 反查,讓使用者在專案細節裡就能看到
   關聯的待辦與記事,不用切頁面自己找。每個項目可點擊直接開啟編輯,
   區塊右上角的「+」則會開啟新增視窗並預先帶入這個專案的關聯。 */
function pvRelatedSectionHtml(title, icon, items, type, projectId){
  const listHtml = items.length
    ? items.map(item=>{
        if(type==='todo'){
          const overdue = !item.done && item.dueDate && new Date(item.dueDate+'T23:59:59') < new Date();
          return `<button type="button" class="search-result-item pv-related-item" data-type="todo" data-id="${esc(item.id)}">
            <span class="sr-title">${item.done?'✅ ':''}${esc(item.title||'-')}</span>
            <span class="sr-meta" style="${overdue?'color:var(--red);':''}">${[item.dueDate?`到期 ${item.dueDate}`:'', item.priority].filter(Boolean).map(esc).join('・')}</span>
          </button>`;
        }
        const c = noteColorInfo(item.color);
        return `<button type="button" class="search-result-item pv-related-item" data-type="note" data-id="${esc(item.id)}" style="border-left:3px solid ${c.border};">
          <span class="sr-title">${item.pinned?'📌 ':''}${esc(item.title||'(無標題)')}</span>
          <span class="sr-meta">${esc((item.content||'').slice(0,40))}${(item.content||'').length>40?'…':''}</span>
        </button>`;
      }).join('')
    : `<div class="form-hint" style="padding:8px 2px;">目前沒有關聯的${type==='todo'?'待辦事項':'記事'}</div>`;
  return `<div class="form-field full" style="margin-top:6px;">
    <label style="display:flex;align-items:center;justify-content:space-between;">
      <span style="display:flex;align-items:center;gap:6px;"><span style="display:inline-flex;width:16px;height:16px;color:var(--blue-700);">${icon}</span>${title}${items.length?`<span style="font-size:11.5px;font-weight:600;color:var(--text-muted);background:var(--blue-100);padding:2px 9px;border-radius:20px;">${items.length}</span>`:''}</span>

function bindPvRelatedSectionEvents(box, projectId){
  box.querySelectorAll('.pv-related-item').forEach(btn=>{

      closeModal();

  box.querySelectorAll('.pv-related-add').forEach(btn=>{

  });
}

function openProjectModal(id, forcedType){
  const editing = !!id;
  const existing = editing ? DATA.projects.find(x=>x.id===id) : null;

    ? p.installments.map(i=>({ year:i.year, month:i.month, amount:i.amount }))

    const auto = document.getElementById('f_auto').checked;
    const contractAmt = Number(document.getElementById('f_amount').value)||0;

      <div class="install-row">
        <div class="idx">${i+1}</div>

      inp.addEventListener('input', e=>{ rows[Number(e.target.dataset.i)].year = Number(e.target.value)||defaultYear; });
    });
    rowsEl.querySelectorAll('.inst-month').forEach(inp=>{
      inp.addEventListener('input', e=>{ rows[Number(e.target.dataset.i)].month = e.target.value; });
    });
    rowsEl.querySelectorAll('.inst-amt').forEach(inp=>{
      inp.addEventListener('input', e=>{ rows[Number(e.target.dataset.i)].amount = Number(e.target.value)||0; updateTotal(); });
    });
    rowsEl.querySelectorAll('.inst-del').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(rows.length<=1){ toast('至少要保留一期'); return; }
        rows.splice(Number(btn.dataset.i),1);
        renderInstallRows();
      });
    });
    updateTotal();
  }
  function updateTotal(){
    const auto = document.getElementById('f_auto').checked;
    const contractAmt = Number(document.getElementById('f_amount').value)||0;
    const count = rows.length;
    let sum;
    if(auto){ sum = contractAmt; }
    else { sum = rows.reduce((a,r)=>a+(Number(r.amount)||0),0); }
    const diff = Math.round((contractAmt - sum)*100)/100;
    document.getElementById('installTotal').innerHTML = auto
      ? `每期約 <b>${money(contractAmt/count)}</b>,合計 <b>${money(contractAmt)}</b>`
      : `已分配 <b>${money(sum)}</b> ／ 合約 <b>${money(contractAmt)}</b>${diff!==0?` <span style="color:var(--red)">(尚差 ${money(diff)})</span>`:''}`;
  }

  document.getElementById('f_addRow').addEventListener('click', ()=>{
    const last = rows[rows.length-1];
    rows.push({ year: last?last.year:defaultYear, month:1, amount:0 });
    renderInstallRows();
  });
  document.getElementById('f_auto').addEventListener('change', renderInstallRows);
  document.getElementById('f_amount').addEventListener('input', renderInstallRows);
  renderInstallRows();

  document.getElementById('mSave').addEventListener('click', async ()=>{
    clearAllFieldErrors(box);
    const clientInput = document.getElementById('f_client');
    const nameInput = document.getElementById('f_name');

    const name = nameInput.value.trim();

    const saveBtn = document.getElementById('mSave');
    saveBtn.disabled = true;
    saveBtn.textContent = '儲存中…';
    const auto = document.getElementById('f_auto').checked;
    const contractAmt = Number(document.getElementById('f_amount').value)||0;
    const evenAmt = auto ? contractAmt/(rows.length||1) : null;
    const oldInstallments = p.installments || [];
    const finalInstallments = rows
      .filter(r=> r.month!=='' && r.month!=null)
      .map((r,i)=>{
        const prev = oldInstallments[i]; // 盡量沿用同一列原本的已收狀態與 id
        return {
          id: (prev && prev.id) || uid(),
          year: Number(r.year)||defaultYear,
          month: Number(r.month)||1,
          amount: auto ? evenAmt : (Number(r.amount)||0),
          received: prev ? !!prev.received : false,
        };
      })
      .sort((a,b)=> a.year-b.year || a.month-b.month);

    const rec = {
      id: p.id, projType:'maintenance', client, code: document.getElementById('f_code').value.trim(),
      name, contractAmount: contractAmt,
      startDate: document.getElementById('f_start').value, endDate: document.getElementById('f_end').value,
      pm: document.getElementById('f_pm').value.trim(), sales: document.getElementById('f_sales').value.trim(),
      terminated: document.getElementById('f_terminated').checked, note: document.getElementById('f_note').value.trim(),
      department: document.getElementById('f_department').value.trim(),
      maintenanceRate: document.getElementById('f_maintRate').value.trim(),
      modHours: Number(document.getElementById('f_modHours').value)||0,
      modUnitPrice: Number(document.getElementById('f_modUnitPrice').value)||0,
      sourceCode: document.getElementById('f_sourceCode').value.trim(),
      contractNo: document.getElementById('f_contractNo').value.trim(), contact: document.getElementById('f_contact').value.trim(),
      invoiceNote: document.getElementById('f_invoiceNote').value.trim(),
      installments: finalInstallments,
      renewalDone: p.renewalDone || false,
    };
    ensureClient(client);
    const idx = DATA.projects.findIndex(x=>x.id===p.id);
    if(idx>=0) DATA.projects[idx] = rec; else DATA.projects.push(rec);
    await persist('projects');
    closeModal();
    if(currentPage==='projects') renderProjectsTable();
    toast(editing?'已儲存變更':'已新增維護專案');
  });
}

/* 無障礙:統一的 Modal 開啟入口。呼叫端先把內容寫進 #modalBox,再呼叫這個函式,
   會記住目前的焦點位置、顯示遮罩,並把鍵盤焦點移到視窗內第一個可操作元素
   (優先移到第一個輸入欄位,沒有的話退而求其次移到第一個按鈕),
   讓鍵盤／螢幕報讀軟體使用者能立刻知道焦點已經進入 Modal。 */
function openModalOverlay(){
  lastFocusedEl = document.activeElement;
  document.getElementById('modalOverlay').classList.add('show');
  const box = document.getElementById('modalBox');
  const firstField = box.querySelector('input, select, textarea');
  const firstFocusable = firstField || box.querySelector('button, [href], [tabindex]:not([tabindex="-1"])');
  if(firstFocusable) firstFocusable.focus();
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('modalBox').innerHTML = '';
  // 無障礙:把焦點還原到開啟 Modal 前所在的位置,避免鍵盤使用者「迷失」在頁面頂端

function parseImportText(text){
  if(!text) return [];
  // strip BOM if present
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
  const firstLineEnd = text.search(/\r?\n/);
  const firstLine = firstLineEnd===-1 ? text : text.slice(0, firstLineEnd);
  const delim = firstLine.includes('\t') ? '\t' : ',';

  // Quote-aware parser: handles delimiters/newlines embedded inside "quoted" fields
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += ch;
      }
      continue;
    }
    if(ch === '"'){ inQuotes = true; continue; }
    if(ch === delim){ row.push(field); field=''; continue; }
    if(ch === '\r'){ continue; }
    if(ch === '\n'){ row.push(field); rows.push(row); row=[]; field=''; continue; }
    field += ch;
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }

  return rows
    .map(r=> r.map(c=>c.trim()))
    .filter(r=> r.some(c=>c.length>0));
}

function buildImportRecord(type, cells){
  if(type==='contacts'){
    const [company,name,department,role,phone,address,email,note] = cells;
    if(!company || !name) return null;
    ensureClient(company.trim());
    return { id:uid(), company:company.trim(), name:name.trim(), department:(department||'').trim(), role:(role||'').trim(), phone:(phone||'').trim(), address:(address||'').trim(), email:(email||'').trim(), note:(note||'').trim() };
  }
  if(type==='maintenance'){
    const [sales, client, code, name, pm, department, amountStr, maintRate, startDate, endDate, modHours, invoiceNote, contractNo, modUnitPrice, sourceCode, note, contact] = cells;
    if(!client || !name) return null;
    ensureClient(client.trim());
    const validDept = ['WM','AM'].includes((department||'').trim()) ? department.trim() : (department||'').trim();
    // best-effort: pull explicit "N月" mentions out of the free-text invoice schedule description
    const monthMatches = [...String(invoiceNote||'').matchAll(/(\d{1,2})\s*月/g)].map(m=>Number(m[1])).filter(m=>m>=1&&m<=12);
    const months = [...new Set(monthMatches)].sort((a,b)=>a-b);
    const parsedStart = parseSlashDate(startDate);
    const parsedEnd = parseSlashDate(endDate);
    const contractAmt = parseAmountStr(amountStr);
    const startY = parsedStart ? new Date(normDate(parsedStart)+'T00:00:00').getFullYear() : new Date().getFullYear();
    const endY = parsedEnd ? new Date(normDate(parsedEnd)+'T00:00:00').getFullYear() : startY;
    // 每年都依這些月份重複收款(如需個別年度不同月份／金額,匯入後可在編輯視窗調整每一期)
    const installments = [];
    if(months.length){
      const evenAmt = contractAmt/(months.length * Math.max(1, endY-startY+1));
      for(let y=startY; y<=endY; y++){
        months.forEach(m=> installments.push({ id:uid(), year:y, month:m, amount:evenAmt, received:false }));
      }
    }
    return {
      id:uid(), projType:'maintenance', client:client.trim(), code:(code||'').trim(), name:name.trim(),
      department:validDept,
      contractAmount:contractAmt, maintenanceRate:(maintRate||'').trim(),
      startDate:parsedStart, endDate:parsedEnd,
      modHours:parseAmountStr(modHours), modUnitPrice:parseAmountStr(modUnitPrice), sourceCode:(sourceCode||'').trim(),
      pm:(pm||'').trim(), sales:(sales||'').trim(), terminated:false,
      contractNo:(contractNo||'').trim(), invoiceNote:(invoiceNote||'').trim(), contact:(contact||'').trim(),
      note:(note||'').trim(),
      installments,
    };
  }
  if(type==='inprogress'){
    const [sales, client, code, name, pm, department, amountStr, maintRate, acceptanceDate, warrantyEnd, warrantyPeriod, contractNo, note, contact] = cells;
    if(!client || !name) return null;
    ensureClient(client.trim());
    const validDept = ['WM','AM'].includes((department||'').trim()) ? department.trim() : (department||'').trim();
    return {
      id:uid(), projType:'inprogress', client:client.trim(), code:(code||'').trim(), name:name.trim(),
      department:validDept,
      contractAmount:parseAmountStr(amountStr), maintenanceRate:(maintRate||'').trim(),
      acceptanceDate:parseSlashDate(acceptanceDate), warrantyEndDate:parseSlashDate(warrantyEnd),
      warrantyPeriod:(warrantyPeriod||'').trim(),
      pm:(pm||'').trim(), sales:(sales||'').trim(), terminated:false,
      contractNo:(contractNo||'').trim(), note:(note||'').trim(), contact:(contact||'').trim(),
    };
  }
  if(type==='todos'){
    const [dueDate, updatedDate, client, category, title, note, progress] = cells;
    if(!title) return null;
    ensureClient((client||'').trim());
    const isoDue = parseSlashDate(dueDate);
    return {
      id:uid(), dueDate:isoDue, updatedDate: parseSlashDate(updatedDate) || todayISO(),
      client:(client||'').trim(), category:(category||'').trim(), title:title.trim(),
      priority: derivePriorityFromDueDate(isoDue), progress:(progress||'').trim(), note:(note||'').trim(), done:false,
    };
  }
  return null;
}

  };

  });

        </tr></thead>

      </table>
    </div>
  </div>`;

function filteredTodos(){
  const now = new Date();
  return DATA.todos.filter(t=>{
    if(todoFilter.q){
      const q = todoFilter.q.toLowerCase();
      const hit = [t.client,t.title,t.category,t.note].some(v=>(v||'').toLowerCase().includes(q));
      if(!hit) return false;
    }
    if(todoFilter.priority==='已完成'){
      return !!t.done;
    }
    if(todoFilter.priority==='overdue'){
      return !t.done && t.dueDate && new Date(t.dueDate+'T23:59:59') < now;
    }
    if(t.done) return false;
    if(todoFilter.priority!=='all' && t.priority!==todoFilter.priority) return false;
    return true;
  }).sort((a,b)=>{
    if(todoFilter.priority==='已完成'){
      return (b.updatedDate||'').localeCompare(a.updatedDate||'');
    }
    return (a.dueDate||'9999').localeCompare(b.dueDate||'9999');
  });
}

function afterTodosRender(presetFilter){
  if(presetFilter==='thisWeek') todoFilter.priority='本週';
  else if(presetFilter==='thisMonth') todoFilter.priority='本月';
  else if(presetFilter==='overdue') todoFilter.priority='overdue';
  else if(presetFilter==='all') todoFilter.priority='all';

  renderTodosTable();
  document.getElementById('tdSearch').addEventListener('input', e=>{ todoFilter.q=e.target.value; renderTodosTable(); });
  document.querySelectorAll('#prioritySeg button').forEach(btn=>{
    btn.addEventListener('click', ()=>{ todoFilter.priority=btn.dataset.v; renderPage(); });
  });
}

        <button class="icon-btn" data-edit="${t.id}" title="編輯待辦" aria-label="編輯待辦「${esc(t.title||'')}」">${ICONS.edit}</button>

  }).join('');

async function confirmDeleteTodo(id){
  const t = DATA.todos.find(x=>x.id===id);

  const ok = await confirmDialog({
    title:'刪除待辦事項',
    message:`確定要刪除待辦「${t.title}」嗎?`,
    confirmLabel:'刪除', cancelLabel:'取消', danger:true,
